<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brand Creator · Kubah Emas</title>
<meta name="theme-color" content="#0F2A2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brand Creator">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --m:#2CC5B8;--m-d:#0B6B68;--m-l:#E3F6F4;--m-b:#A6E1DB;
  --ch:#0F2A2E;--ch2:#17383D;--bg:#F1F6F6;--bg2:#E2EBEB;--card:#fff;--card2:#F8FBFB;
  --txt:#12262A;--txt2:#3B4F53;--mut:#6B8084;--bdr:#DCE7E7;
  --ok:#16A34A;--ok-l:#E8F7EE;--warn:#D97706;--warn-l:#FEF3E2;--bad:#DC2626;--bad-l:#FEF3F2;
  --shd:0 1px 2px rgba(15,42,46,.04),0 6px 20px rgba(15,42,46,.06);
  --font:'Plus Jakarta Sans',-apple-system,sans-serif;--r:18px;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding-bottom:96px}
button,input,select,textarea{font-family:var(--font)}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bdr);padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top))}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ch);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.04em;color:var(--m);flex-shrink:0}
.bn{font-size:15px;font-weight:800;letter-spacing:-.01em}.bs{font-size:11px;color:var(--mut)}
.who{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--ch);color:var(--m);padding:8px 13px;border-radius:999px;border:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--shd);padding:18px;margin-bottom:14px}
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(44,197,184,.34),transparent 55%),var(--ch);color:#fff;border:none}
.hero .mut{color:rgba(255,255,255,.62)}
.mut{color:var(--mut)}
.h{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.hero .h{color:rgba(255,255,255,.55)}
.mid{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.sm{font-size:12px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--m);line-height:1.05}.stat span{font-size:10.5px;color:rgba(255,255,255,.65);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-left:auto}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok-l);color:var(--ok)}.tag.warn{background:var(--warn-l);color:var(--warn)}.tag.bad{background:var(--bad-l);color:var(--bad)}.tag.na{background:var(--bg2);color:var(--mut)}.tag.brand{background:var(--m-l);color:var(--m-d)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.note{display:flex;gap:10px;font-size:12px;line-height:1.55;padding:11px 13px;border-radius:13px;background:var(--card2);border:1px solid var(--bdr);margin-bottom:14px;color:var(--txt2)}
.note.warn{background:var(--warn-l);border-color:#F6D8A8;color:#7C4A03}
.note.bad{background:var(--bad-l);border-color:#FBC9C4;color:#8F1D14}
.note.ok{background:var(--ok-l);border-color:#BDE5CC;color:#14532D}
.kr-t{font-size:13.5px;font-weight:800;line-height:1.35;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:8px 6px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);border-bottom:2px solid var(--bdr)}
td{padding:10px 6px;border-bottom:1px solid var(--bdr);vertical-align:top}
th.r,td.r{text-align:right}
tr:last-child td{border-bottom:none}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.inp,.sel,.ta{width:100%;border:1.5px solid var(--bdr);border-radius:13px;background:var(--card2);padding:0 14px;font-size:14px;font-weight:600;color:var(--txt);outline:none}
.inp,.sel{height:46px}
.ta{padding:12px 14px;min-height:78px;resize:vertical;font-weight:500;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--m-d);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;height:50px;border:none;border-radius:14px;background:var(--m);color:var(--ch);font-size:14.5px;font-weight:800;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--bg2);color:var(--txt)}
.btn.dark{background:var(--ch);color:var(--m)}
.btn.s{height:36px;font-size:12px;margin-top:0;width:auto;padding:0 14px;border-radius:11px}
.btn.danger{background:var(--bad-l);color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--bdr);background:var(--card);border-radius:99px;padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--txt2);cursor:pointer}
.chip.on{background:var(--ch);color:var(--m);border-color:var(--ch)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bdr);padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.nav-in{max-width:760px;margin:0 auto;display:flex;gap:2px}
.nav button{flex:1;border:none;background:none;padding:7px 2px;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{background:var(--ch);color:var(--m)}
.gate{max-width:380px;margin:12vh auto 0;padding:0 18px;text-align:center}
.gate .logo{width:64px;height:64px;font-size:18px;border-radius:19px;margin:0 auto 18px}
.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:800}
.pick{display:flex;flex-direction:column;gap:10px;text-align:left}
.pick button{border:1.5px solid var(--bdr);background:var(--card);border-radius:15px;padding:14px 16px;cursor:pointer;text-align:left}
.pick b{display:block;font-size:15px}.pick span{font-size:11.5px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ch);color:#fff;padding:11px 18px;border-radius:99px;font-size:12.5px;font-weight:700;z-index:99;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);border-radius:16px}
.spin{text-align:center;padding:60px 0;color:var(--mut);font-size:13px;font-weight:600}
.item{border-top:1px solid var(--bdr);padding:12px 0}.item:first-child{border-top:none;padding-top:0}
.cr{display:flex;gap:12px;align-items:flex-start}
.thw{position:relative;width:64px;height:64px;border-radius:12px;background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.thw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cr .bd{flex:1;min-width:0}
.tr{background:var(--card2);border:1px solid var(--bdr);border-radius:13px;padding:11px 12px;margin-top:10px}
.tr .k{font-size:11px;color:var(--mut);font-weight:700}
.linkb{display:inline-block;font-size:12px;font-weight:800;color:var(--m-d);text-decoration:none;margin-right:12px}
.pv{background:var(--m-l);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;margin-top:10px}
.fbox{border:1.5px solid var(--m-b);background:#F4FBFA;border-radius:14px;padding:14px;margin-top:10px}
.rk{font-weight:800;color:var(--m-d)}
.empty{text-align:center;color:var(--mut);font-size:12.5px;padding:18px 6px}
/* input tanggal: jangan pernah melewati kotaknya (Safari/Chrome HP memberi lebar bawaan yang besar) */
input[type=date]{display:block;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left;padding-right:10px}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
.fbox,.fbox *{min-width:0}
.fbox{overflow:hidden}
.dates{display:flex;flex-direction:column;gap:2px}
/* angka Hasil besar */
.bigh{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--m-d)}
.bigh.na{color:var(--mut);font-size:30px}
.hj{font-size:12px;font-weight:700;color:var(--txt2);margin-top:4px}
.inp.huge{height:68px;font-size:30px;font-weight:800;text-align:center}
.rbar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:8px}
.rbar>i{display:block;height:100%;border-radius:99px;background:var(--m)}
.rrow .num{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em;text-align:right}
.rrow.top .num{color:var(--m-d)}
.crl{font-size:12px;color:var(--txt2);margin-top:6px;line-height:1.7}
.crl b{font-weight:800}
.heroTop{font-size:12px;color:rgba(255,255,255,.7);font-weight:600}
.heroName{font-size:26px;font-weight:800;line-height:1.15;margin:4px 0 2px;word-break:break-word}
.heroNum{font-size:56px;font-weight:800;line-height:1;color:var(--m);letter-spacing:-.02em}
/* susunan kartu: 1 kolom di HP, menyesuaikan lebar layar di desktop */
.gridc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px;align-items:start}
.gridc.cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.gridc>.card,.advgrid>.card{margin-bottom:0}
.gridc .span{grid-column:1/-1}
.gridc .chips{margin-bottom:0}
.advgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.fw{max-width:720px}
@media(min-width:860px){
  body{padding-bottom:0}
  body.shell{padding-left:240px}
  body.shell::before{content:'';position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--ch);z-index:40}
  body.shell .top{position:fixed;left:0;top:0;width:240px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;padding:24px 20px 8px}
  body.shell .top-in{max-width:none}
  body.shell .logo{background:var(--m);color:var(--ch)}
  body.shell .bn{color:#fff}body.shell .bs{color:rgba(255,255,255,.55)}
  body.shell .who{position:fixed;left:20px;bottom:22px;width:200px;margin:0;background:var(--ch2);color:var(--m);padding:12px 14px;text-align:left}
  body.shell .nav{position:fixed;left:0;top:96px;bottom:76px;width:240px;background:transparent;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:10px 14px;z-index:60}
  body.shell .nav-in{max-width:none;flex-direction:column;gap:4px}
  body.shell .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:12px 14px;border-radius:12px;color:rgba(255,255,255,.72)}
  body.shell .nav button:hover{background:var(--ch2)}
  body.shell .nav button.on{background:var(--m);color:var(--ch)}
  body.shell .nav button .ic{font-size:18px}
  body.shell .wrap{max-width:none;margin:0;padding:30px 36px 48px}
  .stat b{font-size:34px}.stat span{font-size:12px}
  .toast{bottom:28px}
  .advgrid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-areas:"tay que"}
  .a-que{grid-area:que}.a-tay{grid-area:tay}
}
</style>
</head>
<body>
<div class="top" id="top" style="display:none"><div class="top-in"><div class="logo">BC</div><div><div class="bn">Brand Creator</div><div class="bs">Kubah Emas · Creative ↔ Advertiser</div></div><button class="who" id="whobtn" onclick="switchWho()">—</button></div></div>
<div class="nav" id="nav" style="display:none"><div class="nav-in" id="navin"></div></div>
<div class="wrap" id="view"></div>
<div id="toastbox"></div>
<script>
// ═════════════ KONFIGURASI ═════════════
var APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbx7fvep5uCT_s_RUYbbcv4liCG0jRq5z53kzmz9BaL3QDTw2dI2PfZGo00UHhHnIPu0/exec';
var PIN='1601';
var PEOPLE={
  Lukman:{role:'Advertiser',creator:true,adv:true},
  Dicky:{role:'Brand Creator',creator:true}
};
// "Hasil" mengikuti kolom Hasil di Meta Ads Manager (jenisnya tergantung objektif kampanye)
var JENIS=['Percakapan WA','ThruPlay','Klik tautan','Jangkauan'];
var MONTH_ID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

// ═════════════ UTIL ═════════════
var S={ok:false,who:'',tab:'dash',loaded:false,err:'',kf:'',cf:null,ed:null};
var D={creatives:[],tayang:[],today:''};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function TD(){return D.today||dstr(new Date());}
function dDiff(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function dLabel(s){if(!s)return '—';var d=pd(s);return d.getDate()+' '+MONTH_ID[d.getMonth()].slice(0,3)+' '+d.getFullYear();}
function n0(n){return Math.round(n).toLocaleString('id-ID');}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(msg,bad){var t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=msg;$('toastbox').appendChild(t);setTimeout(function(){t.remove();},bad?5500:2200);}
function can(k){return !!(PEOPLE[S.who]&&PEOPLE[S.who][k]);}
function note(t,type){return '<div class="note '+(type||'')+'"><span>'+(type==='warn'?'⚠️':type==='bad'?'❌':type==='ok'?'✅':'ℹ️')+'</span><span>'+t+'</span></div>';}

// ═════════════ API ═════════════
function apiReady(){return APPS_SCRIPT_URL&&APPS_SCRIPT_URL.indexOf('PASTE_')!==0;}
function apiLoad(){
  return fetch(APPS_SCRIPT_URL+'?action=load&pin='+encodeURIComponent(PIN)+'&cb='+Date.now()).then(function(r){return r.json();}).then(function(j){
    if(!j.ok)throw new Error(j.error||'Server menolak permintaan');
    D={creatives:j.creatives||[],tayang:j.tayang||[],today:j.today||''};
  });
}
function apiPost(p){
  return fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({pin:PIN,by:S.who},p))})
    .then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Gagal menyimpan');return j;});
}
function saveAndReload(p,okMsg){
  return apiPost(p).then(function(){return apiLoad();}).then(function(){toast(okMsg||'Tersimpan');render();return true;})
    .catch(function(e){var m=String(e.message||e);if(/tidak dikenal/.test(m))m='Server belum diperbarui: deploy ulang Apps Script terbaru.';toast(m,true);return false;});
}

// ═════════════ DATA TURUNAN ═════════════
function creativeOf(id){return D.creatives.filter(function(c){return c.id===id;})[0]||null;}
function tayOf(cid){return D.tayang.filter(function(t){return t.cid===cid;}).sort(function(a,b){return a.mulai<b.mulai?1:a.mulai>b.mulai?-1:0;});}
function tStatus(t){var td=TD();if(td<t.mulai)return 'Terjadwal';if(t.selesai&&td>t.selesai)return 'Selesai';return 'Berjalan';}
function tDays(t){var td=TD();if(td<t.mulai)return 0;var end=t.selesai&&t.selesai<td?t.selesai:td;return dDiff(t.mulai,end)+1;}
function jenisLabel(name){var n=String(name||'').trim().toLowerCase();for(var i=0;i<JENIS.length;i++)if(JENIS[i].toLowerCase()===n)return JENIS[i];return String(name||'').trim();}
function crStatus(c){
  var ts=tayOf(c.id);if(!ts.length)return {t:'na',x:'Belum tayang'};
  if(ts.some(function(t){return tStatus(t)==='Berjalan';}))return {t:'ok',x:'Berjalan'+(ts.length>1?' · '+ts.length+' tayang':'')};
  if(ts.every(function(t){return tStatus(t)==='Terjadwal';}))return {t:'warn',x:'Terjadwal'};
  return {t:'brand',x:'Selesai'+(ts.length>1?' · '+ts.length+' tayang':'')};
}
function kampanyeList(){   // kampanye unik, yang terbaru di depan
  var seen={},out=[];
  D.creatives.slice().sort(function(a,b){return a.created<b.created?1:-1;}).forEach(function(c){var k=c.kampanye.toLowerCase();if(!seen[k]){seen[k]=1;out.push(c.kampanye);}});
  return out;
}
// Peringkat kampanye menurut jumlah Hasil. Jenis hasil berbeda tidak dijumlahkan (ThruPlay ribuan akan menenggelamkan Percakapan WA).
function rankData(){
  var groups={};
  D.tayang.forEach(function(t){
    if(!t.jenis||t.hasil==null)return;
    var c=creativeOf(t.cid);if(!c)return;
    var jl=jenisLabel(t.jenis),jk=jl.toLowerCase(),g=groups[jk]||(groups[jk]={label:jl,camps:{}});
    var ck=c.kampanye.toLowerCase(),k=g.camps[ck]||(g.camps[ck]={name:c.kampanye,total:0,n:0,cre:{}});
    k.total+=t.hasil;k.n++;
    var e=k.cre[c.id]||(k.cre[c.id]={c:c,hasil:0});e.hasil+=t.hasil;
  });
  return Object.keys(groups).map(function(jk){
    var g=groups[jk];
    g.list=Object.keys(g.camps).map(function(k){var c=g.camps[k];c.creList=Object.keys(c.cre).map(function(i){return c.cre[i];}).sort(function(a,b){return b.hasil-a.hasil||(a.c.nama<b.c.nama?-1:1);});return c;})
      .sort(function(a,b){return b.total-a.total||(a.name<b.name?-1:1);});
    return g;
  }).sort(function(a,b){return b.list.length-a.list.length||(a.label<b.label?-1:1);});
}

// ═════════════ SHELL ═════════════
function gate(){
  document.body.classList.remove('shell');$('top').style.display='none';$('nav').style.display='none';
  $('view').innerHTML='<div class="gate"><div class="logo">BC</div><div class="mid" style="margin-bottom:6px">Brand Creator</div>'+
    '<div class="sm mut" style="margin-bottom:22px">Masukkan PIN tim untuk membuka.</div>'+
    '<input class="inp pin" id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" onkeydown="if(event.key===\'Enter\')tryPin()">'+
    '<div class="sm" id="pinerr" style="color:var(--bad);min-height:22px;margin-top:8px;font-weight:700"></div>'+
    '<button class="btn" onclick="tryPin()">Buka</button></div>';
  setTimeout(function(){var e=$('pin');if(e)e.focus();},50);
}
function tryPin(){var v=$('pin').value;if(v===PIN){S.ok=true;ls('bc_pin_ok','1');start();}else{$('pinerr').textContent='PIN salah.';$('pin').value='';}}
function pickWho(){
  document.body.classList.remove('shell');$('top').style.display='none';$('nav').style.display='none';
  $('view').innerHTML='<div class="gate" style="margin-top:8vh"><div class="logo">BC</div><div class="mid" style="margin-bottom:6px">Siapa Anda?</div>'+
    '<div class="sm mut" style="margin-bottom:20px">Pilihan diingat di HP ini. Ini penanda, bukan verifikasi identitas.</div><div class="pick">'+
    Object.keys(PEOPLE).map(function(n){return '<button onclick="setWho(\''+n+'\')"><b>'+n+'</b><span>'+PEOPLE[n].role+'</span></button>';}).join('')+'</div></div>';
}
function setWho(n){S.who=n;ls('bc_who',n);S.tab='dash';S.cf=null;S.ed=null;start();}
function switchWho(){ls('bc_who',null);S.who='';pickWho();}
function start(){
  if(!S.ok){gate();return;}
  if(!S.who||!PEOPLE[S.who]){pickWho();return;}
  document.body.classList.add('shell');
  $('top').style.display='block';$('nav').style.display='block';$('whobtn').textContent=S.who+' ⇄';
  if(!apiReady()){$('view').innerHTML='<div class="card"><div class="mid" style="margin-bottom:8px">Apps Script belum dipasang</div><div class="sm mut">Isi <b>APPS_SCRIPT_URL</b> di index.html dengan URL deploy (/exec), lalu upload ulang.</div></div>';return;}
  $('view').innerHTML='<div class="spin">Memuat data…</div>';
  apiLoad().then(function(){S.loaded=true;S.err='';render();}).catch(function(e){
    var m=String(e.message||e);
    if(/PIN salah/.test(m)){ls('bc_pin_ok',null);S.ok=false;gate();return;}
    S.err=m;render();
  });
}
function nav(){
  var items=[['dash','📊','Dashboard'],['cr','🎨','Creative'],['adv','📣','Advertiser']];
  $('navin').innerHTML=items.map(function(i){return '<button class="'+(S.tab===i[0]?'on':'')+'" onclick="goTab(\''+i[0]+'\')"><span class="ic">'+i[1]+'</span>'+i[2]+'</button>';}).join('');
}
function goTab(t){S.tab=t;S.cf=null;S.ed=null;render();window.scrollTo(0,0);}
function errHint(m){
  if(/Masih versi lama|masih versi lama/.test(m))return 'Tab di Spreadsheet masih dari versi lama. <b>Hapus tab Creative, Tayang, dan Config</b> di Spreadsheet, lalu tekan Coba lagi (tab baru dibuat otomatis).';
  if(/Unexpected token|JSON|DOCTYPE|<html/i.test(m))return 'Server membalas halaman web, bukan data. Biasanya akses deploy belum <b>Anyone</b>, atau URL belum menunjuk ke versi terbaru. Di Apps Script: Deploy → Manage deployments → Edit → Version: <b>New</b> → Deploy, pastikan "Who has access" = Anyone, lalu pastikan URL yang dipakai berakhiran <b>/exec</b>.';
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return 'App tidak bisa menghubungi Apps Script. Cek koneksi internet. Kalau koneksi normal, biasanya akses deploy belum <b>Anyone</b> atau URL salah (harus berakhiran /exec).';
  if(/tidak terhubung ke Spreadsheet|null|getActiveSpreadsheet|openById|Unexpected sheet|not found|tidak ditemukan/i.test(m))return 'Script tidak bisa membuka Spreadsheet. Pastikan <b>SHEET_ID</b> di bagian atas kode Apps Script berisi ID Spreadsheet yang benar, lalu Deploy → Version: New.';
  if(/izin|permission|authoriz|Exception/i.test(m))return 'Script belum diberi izin. Di editor Apps Script, pilih fungsi <b>authorize_</b>, klik Run, setujui izin, lalu Deploy → Version: New.';
  return 'Kirim pesan di atas ke Lukman/pembuat app supaya bisa dilacak.';
}
function render(){
  if(!S.ok||!S.who)return;
  nav();
  if(S.err&&!S.loaded){$('view').innerHTML='<div class="card fw"><div class="mid" style="margin-bottom:8px">Gagal memuat data</div><div class="sm" style="margin-bottom:8px;font-weight:700;color:var(--bad)">'+esc(S.err)+'</div><div class="sm mut" style="margin-bottom:6px">'+errHint(String(S.err))+'</div><button class="btn" onclick="start()">Coba lagi</button></div>';return;}
  $('view').innerHTML=S.tab==='cr'?vCreative():S.tab==='adv'?vAdv():vDash();
}

// ═════════════ DASHBOARD: kampanye dengan Hasil terbesar ═════════════
function vDash(){
  var rd=rankData(),h='';
  h+='<div class="card hero"><div class="h">Kampanye dengan Hasil terbesar</div>';
  if(!rd.length){
    h+='<div class="heroName">Belum ada Hasil</div><div class="sm mut">Hasil diisi Advertiser di tab Advertiser setelah iklan tayang.</div>';
  }else{
    var g0=rd[0],top=g0.list[0];
    h+='<div class="heroTop">'+esc(g0.label)+'</div><div class="heroName">'+esc(top.name)+'</div><div class="heroNum">'+n0(top.total)+'</div>';
    if(rd.length>1)h+='<div class="sm" style="margin-top:12px;color:rgba(255,255,255,.75)">'+rd.slice(1).map(function(g){return '<div>'+esc(g.label)+': <b style="color:#fff">'+esc(g.list[0].name)+'</b> · '+n0(g.list[0].total)+'</div>';}).join('')+'</div>';
  }
  h+='</div>';
  h+='<div class="gridc">';
  rd.forEach(function(g){
    var max=g.list[0].total||1;
    h+='<div class="card"><div class="h">Peringkat kampanye · Hasil '+esc(g.label)+'</div>'+g.list.map(function(k,i){
      var w=k.total>0?Math.max(3,Math.round(k.total/max*100)):0;
      return '<div class="item rrow'+(i===0?' top':'')+'"><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><div class="kr-t"><span class="rk">'+(i===0&&g.list.length>1?'🏆 ':'#'+(i+1)+' ')+'</span>'+esc(k.name)+'</div>'+
        '<div class="sm mut" style="margin-top:2px">'+k.creList.length+' creative · '+k.n+' tayang</div></div><div class="num">'+n0(k.total)+'</div></div>'+
        '<div class="rbar"><i style="width:'+w+'%"></i></div>'+
        '<div class="crl">'+k.creList.map(function(e){return esc(e.c.nama)+' <b>'+n0(e.hasil)+'</b>';}).join(' · ')+'</div></div>';
    }).join('')+'</div>';
  });
  var withHasil={};rd.forEach(function(g){g.list.forEach(function(k){withHasil[k.name.toLowerCase()]=1;});});
  var none=kampanyeList().filter(function(k){return !withHasil[k.toLowerCase()];});
  if(none.length)h+='<div class="card"><div class="h">Kampanye belum ada Hasil</div><div class="sm">'+none.map(esc).join(', ')+'</div></div>';
  h+='</div>';
  if(!rd.length&&!D.creatives.length)h+=note('Belum ada creative. Brand Creator mengisi di tab Creative.');
  return h;
}

// ═════════════ CREATIVE (Brand Creator) ═════════════
function setKf(v){S.kf=v;render();}
function vCreative(){
  var h='<div class="row" style="margin-bottom:12px"><div class="mid">Creative</div>'+(can('creator')&&!S.cf?'<button class="btn s sp" onclick="cfOpen(\'\')">+ Input creative</button>':'')+'</div>';
  if(S.cf)h+=cfForm();
  var ks=kampanyeList();
  if(ks.length>1)h+='<div class="chips"><button class="chip '+(!S.kf?'on':'')+'" onclick="setKf(\'\')">Semua kampanye</button>'+ks.map(function(k,i){return '<button class="chip '+(S.kf===k?'on':'')+'" onclick="setKf(KS['+i+'])">'+esc(k)+'</button>';}).join('')+'</div>';
  KS=ks;
  var list=D.creatives.filter(function(c){return !S.kf||c.kampanye===S.kf;}).sort(function(a,b){return a.created<b.created?1:-1;});
  if(!list.length)return h+'<div class="card"><div class="empty">Belum ada creative.</div></div>';
  h+='<div class="gridc cards">'+list.map(function(c){
    var s=crStatus(c),sum={};
    tayOf(c.id).forEach(function(t){if(t.jenis&&t.hasil!=null){var j=jenisLabel(t.jenis);sum[j]=(sum[j]||0)+t.hasil;}});
    var hs=Object.keys(sum).map(function(j){return '<b>'+n0(sum[j])+'</b> '+esc(j);}).join(' · ');
    return '<div class="card"><div class="kr-t">'+esc(c.nama)+'</div><div class="tags"><span class="tag brand">'+esc(c.kampanye)+'</span><span class="tag '+s.t+'">'+s.x+'</span></div>'+
      (hs?'<div class="sm">Hasil: '+hs+'</div>':'')+
      '<div class="sm mut" style="margin-top:4px">Oleh '+esc(c.by)+' · '+dLabel((c.created||'').slice(0,10))+'</div>'+
      (can('creator')?'<div class="acts"><button class="btn s ghost" onclick="cfOpen(\''+c.id+'\')">Ubah</button><button class="btn s danger" onclick="cfDelete(\''+c.id+'\')">Hapus</button></div>':'')+'</div>';
  }).join('')+'</div>';
  return h;
}
var KS=[];
function cfOpen(id){
  var c=id?creativeOf(id):null;
  S.cf=c?{id:c.id,nama:c.nama,kamp:c.kampanye}:{id:uid('c'),nama:'',kamp:''};
  render();window.scrollTo(0,0);
}
function cfSync(){var f=S.cf;if(!f||!$('cf_nama'))return;f.nama=$('cf_nama').value;f.kamp=$('cf_kamp').value;}
function cfPickK(i){cfSync();S.cf.kamp=KS[i];render();}
function cfForm(){
  var f=S.cf,isNew=!creativeOf(f.id),ks=kampanyeList();KS=ks;
  return '<div class="card fw" style="border-color:var(--m-b)"><div class="h">'+(isNew?'Creative baru':'Ubah creative')+'</div>'+
    '<label class="lbl">Nama file *</label><input class="inp" id="cf_nama" maxlength="120" value="'+esc(f.nama)+'" placeholder="mis. Reels Promo Baja Ringan v2">'+
    '<label class="lbl">Untuk kampanye apa? *</label><input class="inp" id="cf_kamp" maxlength="80" value="'+esc(f.kamp)+'" placeholder="mis. Promo Akhir Tahun">'+
    (ks.length?'<div class="sm mut" style="margin:8px 0 6px">Kampanye yang sudah ada (ketuk untuk memakai):</div><div class="chips" style="margin-bottom:0">'+ks.slice(0,10).map(function(k,i){return '<button class="chip '+(f.kamp.toLowerCase()===k.toLowerCase()?'on':'')+'" onclick="cfPickK('+i+')">'+esc(k)+'</button>';}).join('')+'</div>':'')+
    '<button class="btn" id="cf_save" onclick="cfSave()">Simpan creative</button><button class="btn ghost" onclick="S.cf=null;render()">Batal</button></div>';
}
function cfSave(){
  cfSync();var f=S.cf;
  if(!f.nama.trim()){toast('Nama file wajib diisi',true);return;}
  if(!f.kamp.trim()){toast('Isi untuk kampanye apa',true);return;}
  $('cf_save').disabled=true;
  saveAndReload({action:'creative',id:f.id,nama:f.nama.trim(),kampanye:f.kamp.trim()},'Creative tersimpan').then(function(ok){
    if(ok){S.cf=null;render();return;}
    var e=$('cf_save');if(e)e.disabled=false;
  });
}
function cfDelete(id){
  var c=creativeOf(id);if(!c)return;
  if(!confirm('Hapus creative "'+c.nama+'"? Tidak bisa dihapus kalau masih ada tayang.'))return;
  saveAndReload({action:'creativeDelete',id:id},'Creative dihapus');
}

// ═════════════ ADVERTISER ═════════════
function edOpen(o){S.ed=o;render();var e=$('edbox');if(e)e.scrollIntoView({block:'center'});}
function edClose(){S.ed=null;render();}
function edSync(){
  var e=S.ed;if(!e)return;
  if($('ed_mulai'))e.mulai=$('ed_mulai').value;
  if($('ed_selesai'))e.selesai=$('ed_selesai').value;
  if($('ed_jenis'))e.jenis=$('ed_jenis').value;
  if($('ed_jx'))e.jx=$('ed_jx').value;
  if($('ed_hasil'))e.hasil=$('ed_hasil').value;
}
function newTayang(cid){edOpen({type:'tayang',cid:cid,id:'',mulai:TD(),selesai:''});}
function vAdv(){
  var h='<div class="mid" style="margin-bottom:12px">Advertiser</div>';
  if(!can('adv'))h+=note('Tab ini untuk Advertiser (Lukman). Anda bisa melihat, tidak bisa mengubah.');
  var queue=D.creatives.filter(function(c){return !tayOf(c.id).length;}).sort(function(a,b){return a.created<b.created?-1:1;});
  var live=D.creatives.filter(function(c){return tayOf(c.id).length;}).sort(function(a,b){return tayOf(b.id)[0].mulai<tayOf(a.id)[0].mulai?-1:1;});
  h+='<div class="advgrid">';
  h+='<div class="card a-que"><div class="h">Antrean · belum tayang ('+queue.length+')</div>';
  if(!queue.length)h+='<div class="empty">Tidak ada antrean. Semua creative sudah punya jadwal tayang.</div>';
  queue.forEach(function(c){
    var age=dDiff((c.created||TD()).slice(0,10),TD());
    h+='<div class="item"><div class="kr-t">'+esc(c.nama)+'</div><div class="tags"><span class="tag brand">'+esc(c.kampanye)+'</span></div><div class="sm mut">Masuk '+(age<=0?'hari ini':age+' hari lalu')+' · oleh '+esc(c.by)+'</div>'+
      (can('adv')?'<div class="acts"><button class="btn s" onclick="newTayang(\''+c.id+'\')">Atur tayang</button></div>':'')+edBoxFor(c.id,'')+'</div>';
  });
  h+='</div>';
  h+='<div class="card a-tay"><div class="h">Tayang & Hasil ('+live.length+' creative)</div>';
  if(!live.length)h+='<div class="empty">Belum ada tayang.</div>';
  live.forEach(function(c){
    h+='<div class="item"><div class="kr-t">'+esc(c.nama)+'</div><div class="tags"><span class="tag brand">'+esc(c.kampanye)+'</span></div>';
    tayOf(c.id).forEach(function(t){h+=tayRow(c,t);});
    if(can('adv'))h+='<div class="acts"><button class="btn s ghost" onclick="newTayang(\''+c.id+'\')">+ Tayang baru</button></div>'+edBoxFor(c.id,'');
    h+='</div>';
  });
  return h+'</div></div>';
}
function tayRow(c,t){
  var st=tStatus(t),stT=st==='Berjalan'?'ok':st==='Selesai'?'brand':'warn';
  var per=dLabel(t.mulai)+' → '+(t.selesai?dLabel(t.selesai):'sekarang')+(st==='Terjadwal'?'':' · '+tDays(t)+' hari');
  var hs;
  if(st==='Terjadwal')hs='<div class="sm mut" style="margin-top:8px">🔒 Hasil terkunci sampai iklan mulai tayang ('+dLabel(t.mulai)+').</div>';
  else if(t.hasil==null)hs='<div class="bigh na" style="margin-top:10px">—</div><div class="hj" style="color:var(--warn)">Hasil belum diisi</div>';
  else hs='<div class="bigh" style="margin-top:10px">'+n0(t.hasil)+'</div><div class="hj">'+esc(jenisLabel(t.jenis))+'</div><div class="sm mut">Diperbarui '+dLabel((t.hasilTs||'').slice(0,10))+'</div>';
  var acts='';
  if(can('adv')){
    acts='<div class="acts">'+(st==='Terjadwal'?'':'<button class="btn s" onclick="hasilOpen(\''+t.id+'\')">'+(t.hasil==null?'Isi Hasil':'Ubah Hasil')+'</button>')+
      '<button class="btn s ghost" onclick="edOpen({type:\'tayang\',cid:\''+c.id+'\',id:\''+t.id+'\',mulai:\''+t.mulai+'\',selesai:\''+t.selesai+'\'})">Ubah periode</button>'+
      (st==='Berjalan'&&!t.selesai?'<button class="btn s ghost" onclick="tStop(\''+t.id+'\')">Hentikan hari ini</button>':'')+
      '<button class="btn s danger" onclick="tDel(\''+t.id+'\')">Hapus</button></div>';
  }
  return '<div class="tr"><div class="row"><b class="sm">'+per+'</b><span class="tag '+stT+' sp">'+st+'</span></div>'+hs+acts+edBoxFor(c.id,t.id)+'</div>';
}
// kotak edit muncul tepat di bawah item yang sedang diedit
function edBoxFor(cid,tid){
  var e=S.ed;if(!e||e.cid!==cid||(e.id||'')!==(tid||''))return '';
  if(e.type==='tayang')return '<div class="fbox" id="edbox"><div class="h">'+(e.id?'Ubah periode tayang':'Atur tayang')+'</div>'+
    '<div class="dates"><label class="lbl">Mulai tayang *</label><input class="inp" type="date" id="ed_mulai" value="'+esc(e.mulai)+'">'+
    '<label class="lbl">Selesai tayang (kosongkan kalau masih berjalan)</label><input class="inp" type="date" id="ed_selesai" value="'+esc(e.selesai)+'"></div>'+
    '<div class="sm mut" style="margin-top:10px">Hasil baru bisa diisi setelah tanggal mulai tiba.</div>'+
    '<button class="btn" id="ed_save" onclick="saveTayang()">Simpan</button><button class="btn ghost" onclick="edClose()">Batal</button></div>';
  if(e.type==='hasil'){
    var isX=e.jenis==='__x';
    return '<div class="fbox" id="edbox"><div class="h">Hasil · '+esc(dLabel(e.mulai))+' → '+(e.selesai?esc(dLabel(e.selesai)):'sekarang')+'</div>'+
      '<label class="lbl">Jenis hasil (sama dengan kolom Hasil di Meta)</label><select class="sel" id="ed_jenis" onchange="edSync();render()">'+
      JENIS.map(function(j){return '<option value="'+esc(j)+'"'+(e.jenis===j?' selected':'')+'>'+esc(j)+'</option>';}).join('')+'<option value="__x"'+(isX?' selected':'')+'>Lainnya (ketik sendiri)…</option></select>'+
      (isX?'<input class="inp" style="margin-top:8px" id="ed_jx" maxlength="40" value="'+esc(e.jx||'')+'" placeholder="mis. Pembelian">':'')+
      '<label class="lbl">Hasil</label><input class="inp huge" type="number" inputmode="numeric" min="0" step="1" id="ed_hasil" value="'+esc(e.hasil)+'" placeholder="0">'+
      '<div class="sm mut" style="margin-top:8px">Isi <b>total sejak mulai tayang</b>, bukan per hari. Di Meta, atur rentang tanggal sama dengan periode tayang ini.</div>'+
      '<button class="btn" id="ed_save" onclick="saveHasil()">Simpan Hasil</button><button class="btn ghost" onclick="edClose()">Batal</button></div>';
  }
  return '';
}
function hasilOpen(tid){
  var t=D.tayang.filter(function(x){return x.id===tid;})[0];if(!t)return;
  var known=t.jenis&&JENIS.some(function(j){return j.toLowerCase()===t.jenis.toLowerCase();});
  var jk=known?jenisLabel(t.jenis):(t.jenis?'__x':JENIS[0]);
  edOpen({type:'hasil',cid:t.cid,id:t.id,mulai:t.mulai,selesai:t.selesai,jenis:jk,jx:known?'':(t.jenis||''),hasil:t.hasil==null?'':String(t.hasil)});
}
function saveTayang(){
  edSync();var e=S.ed;
  if(!e.mulai){toast('Tanggal mulai tayang wajib diisi',true);return;}
  if(e.selesai&&e.selesai<e.mulai){toast('Tanggal selesai tidak boleh sebelum mulai',true);return;}
  $('ed_save').disabled=true;
  saveAndReload({action:'tayang',id:e.id||uid('t'),cid:e.cid,mulai:e.mulai,selesai:e.selesai||''},'Tayang tersimpan').then(function(ok){if(ok){S.ed=null;render();}else{var b=$('ed_save');if(b)b.disabled=false;}});
}
function saveHasil(){
  edSync();var e=S.ed;
  var j=e.jenis==='__x'?String(e.jx||'').trim():e.jenis;
  if(!j){toast('Isi jenis hasil',true);return;}
  if(e.hasil===''){toast('Isi angka Hasil (isi 0 kalau memang 0)',true);return;}
  if(!/^\d+$/.test(String(e.hasil))){toast('Hasil harus bilangan bulat tanpa titik/koma',true);return;}
  $('ed_save').disabled=true;
  saveAndReload({action:'tayang',id:e.id,cid:e.cid,mulai:e.mulai,selesai:e.selesai||'',jenis:j,hasil:+e.hasil},'Hasil tersimpan').then(function(ok){if(ok){S.ed=null;render();}else{var b=$('ed_save');if(b)b.disabled=false;}});
}
function tStop(id){
  var t=D.tayang.filter(function(x){return x.id===id;})[0];if(!t)return;
  if(!confirm('Hentikan tayang ini hari ini ('+dLabel(TD())+')?'))return;
  saveAndReload({action:'tayang',id:t.id,cid:t.cid,mulai:t.mulai,selesai:TD()},'Tayang dihentikan');
}
function tDel(id){
  if(!confirm('Hapus tayang ini? Hasil yang sudah diisi ikut hilang dari dashboard.'))return;
  saveAndReload({action:'tayangDelete',id:id},'Dihapus');
}

// ═════════════ INIT ═════════════
(function(){
  S.ok=ls('bc_pin_ok')==='1';S.who=ls('bc_who')||'';
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
  start();
})();
</script>
</body>
