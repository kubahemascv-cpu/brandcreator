<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brand Creator · Kubah Emas</title>
<meta name="theme-color" content="#0F2A2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brand Creator">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --m:#2CC5B8;--m-d:#0B6B68;--m-l:#E3F6F4;--m-b:#A6E1DB;
  --ch:#0F2A2E;--ch2:#17383D;--bg:#F1F6F6;--bg2:#E2EBEB;--card:#fff;--card2:#F8FBFB;
  --txt:#12262A;--txt2:#3B4F53;--mut:#6B8084;--bdr:#DCE7E7;
  --ok:#16A34A;--ok-l:#E8F7EE;--warn:#D97706;--warn-l:#FEF3E2;--bad:#DC2626;--bad-l:#FEF3F2;
  --shd:0 1px 2px rgba(15,42,46,.04),0 6px 20px rgba(15,42,46,.06);
  --font:'Plus Jakarta Sans',-apple-system,sans-serif;--r:18px;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding-bottom:96px}
button,input,select,textarea{font-family:var(--font)}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bdr);padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top))}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ch);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.04em;color:var(--m);flex-shrink:0}
.bn{font-size:15px;font-weight:800;letter-spacing:-.01em}.bs{font-size:11px;color:var(--mut)}
.who{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--ch);color:var(--m);padding:8px 13px;border-radius:999px;border:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--shd);padding:18px;margin-bottom:14px}
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(44,197,184,.34),transparent 55%),var(--ch);color:#fff;border:none}
.hero .mut{color:rgba(255,255,255,.62)}
.mut{color:var(--mut)}
.h{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.hero .h{color:rgba(255,255,255,.55)}
.mid{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.sm{font-size:12px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}

.stat .sub{display:block;font-size:10px;line-height:1.45;color:rgba(255,255,255,.55);font-weight:600;margin-top:4px}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--m);line-height:1.05}.stat span{font-size:10.5px;color:rgba(255,255,255,.65);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-left:auto}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok-l);color:var(--ok)}.tag.warn{background:var(--warn-l);color:var(--warn)}.tag.bad{background:var(--bad-l);color:var(--bad)}.tag.na{background:var(--bg2);color:var(--mut)}.tag.brand{background:var(--m-l);color:var(--m-d)}.tag.dv{background:var(--ch);color:var(--m)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.note{display:flex;gap:10px;font-size:12px;line-height:1.55;padding:11px 13px;border-radius:13px;background:var(--card2);border:1px solid var(--bdr);margin-bottom:14px;color:var(--txt2)}
.note.warn{background:var(--warn-l);border-color:#F6D8A8;color:#7C4A03}
.note.bad{background:var(--bad-l);border-color:#FBC9C4;color:#8F1D14}
.note.ok{background:var(--ok-l);border-color:#BDE5CC;color:#14532D}
.kr-t{font-size:13.5px;font-weight:800;line-height:1.35;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:8px 6px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);border-bottom:2px solid var(--bdr)}
td{padding:10px 6px;border-bottom:1px solid var(--bdr);vertical-align:top}
th.r,td.r{text-align:right}
tr:last-child td{border-bottom:none}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.inp,.sel,.ta{width:100%;border:1.5px solid var(--bdr);border-radius:13px;background:var(--card2);padding:0 14px;font-size:14px;font-weight:600;color:var(--txt);outline:none}
.inp,.sel{height:46px}
.ta{padding:12px 14px;min-height:78px;resize:vertical;font-weight:500;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--m-d);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;height:50px;border:none;border-radius:14px;background:var(--m);color:var(--ch);font-size:14.5px;font-weight:800;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--bg2);color:var(--txt)}
.btn.dark{background:var(--ch);color:var(--m)}
.btn.s{height:36px;font-size:12px;margin-top:0;width:auto;padding:0 14px;border-radius:11px}
.btn.danger{background:var(--bad-l);color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--bdr);background:var(--card);border-radius:99px;padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--txt2);cursor:pointer}
.chip.on{background:var(--ch);color:var(--m);border-color:var(--ch)}
.chip.xs{padding:6px 12px;font-size:11.5px}
.dvh{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--m-d);margin:18px 0 8px}
.killbox{background:var(--bad-l);border:1px solid #FBC9C4;color:#8F1D14;border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.5;margin-top:8px}
.btn.kill{background:var(--bad);color:#fff}
.ctrl{font-size:12px;font-weight:700;color:var(--txt2);margin-top:4px}
.ctrl b{font-size:15px;color:var(--m-d)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.kpi .k{background:var(--card2);border:1px solid var(--bdr);border-radius:14px;padding:12px 13px;min-width:0}
.kpi .k b{display:block;font-size:28px;font-weight:800;line-height:1.05;color:var(--m-d)}
.kpi .k b small{font-size:14px;color:var(--mut);font-weight:700}
.kpi .k span{display:block;font-size:11px;font-weight:800;color:var(--txt2);margin-top:6px}
.kpi .k .sub{font-size:10.5px;color:var(--mut);font-weight:600;line-height:1.45;margin-top:3px}
.kpi .k.wide{grid-column:1/-1}
.stt{display:inline-block;font-size:15px;font-weight:800;letter-spacing:.03em;padding:8px 14px;border-radius:12px}
.stt.ok{background:var(--ok-l);color:var(--ok)}.stt.brand{background:var(--m-l);color:var(--m-d)}.stt.bad{background:var(--bad-l);color:var(--bad)}.stt.na{background:var(--bg2);color:var(--mut)}
.kepbox{border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.5;margin-top:8px;border:1px solid var(--bdr);background:var(--card2)}
.kepbox.win{background:var(--ok-l);border-color:#BDE5CC;color:#14532D}
.cara{margin-top:14px;font-size:12px;line-height:1.65;color:var(--txt2)}
.cara summary{cursor:pointer;font-weight:800;color:var(--m-d)}
.cara ul{margin:8px 0 0 18px}
.btn.win{background:var(--ok);color:#fff}
.tgt .bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:8px}
.tgt .bar>i{display:block;height:100%;border-radius:99px;background:var(--m)}
.tgt .fr{font-size:22px;font-weight:800;line-height:1}.tgt .fr small{font-size:13px;color:var(--mut);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bdr);padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.nav-in{max-width:760px;margin:0 auto;display:flex;gap:2px}
.nav button{flex:1;border:none;background:none;padding:7px 2px;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{background:var(--ch);color:var(--m)}
.gate{max-width:380px;margin:12vh auto 0;padding:0 18px;text-align:center}
.gate .logo{width:64px;height:64px;font-size:18px;border-radius:19px;margin:0 auto 18px}
.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:800}
.pick{display:flex;flex-direction:column;gap:10px;text-align:left}
.pick button{border:1.5px solid var(--bdr);background:var(--card);border-radius:15px;padding:14px 16px;cursor:pointer;text-align:left}
.pick b{display:block;font-size:15px}.pick span{font-size:11.5px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ch);color:#fff;padding:11px 18px;border-radius:99px;font-size:12.5px;font-weight:700;z-index:99;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);border-radius:16px}
.spin{text-align:center;padding:60px 0;color:var(--mut);font-size:13px;font-weight:600}
.item{border-top:1px solid var(--bdr);padding:12px 0}.item:first-child{border-top:none;padding-top:0}
.cr{display:flex;gap:12px;align-items:flex-start}
.thw{position:relative;width:64px;height:64px;border-radius:12px;background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.thw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cr .bd{flex:1;min-width:0}
.tr{background:var(--card2);border:1px solid var(--bdr);border-radius:13px;padding:11px 12px;margin-top:10px}
.tr .k{font-size:11px;color:var(--mut);font-weight:700}
.linkb{display:inline-block;font-size:12px;font-weight:800;color:var(--m-d);text-decoration:none;margin-right:12px}
.pv{background:var(--m-l);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;margin-top:10px}
.fbox{border:1.5px solid var(--m-b);background:#F4FBFA;border-radius:14px;padding:14px;margin-top:10px}
.rk{font-weight:800;color:var(--m-d)}
.empty{text-align:center;color:var(--mut);font-size:12.5px;padding:18px 6px}
/* input tanggal: jangan pernah melewati kotaknya (Safari/Chrome HP memberi lebar bawaan yang besar) */
input[type=date]{display:block;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left;padding-right:10px}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
.fbox,.fbox *{min-width:0}
.fbox{overflow:hidden}
.dates{display:flex;flex-direction:column;gap:2px}
/* angka Hasil besar */
.bigh{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--m-d)}
.bigh.na{color:var(--mut);font-size:30px}
.hj{font-size:12px;font-weight:700;color:var(--txt2);margin-top:4px}
.inp.huge{height:68px;font-size:30px;font-weight:800;text-align:center}
.rbar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:8px}
.rbar>i{display:block;height:100%;border-radius:99px;background:var(--m)}
.rrow .num{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em;text-align:right}
.rrow.best .num{color:var(--m-d)}
.crl{font-size:12px;color:var(--txt2);margin-top:6px;line-height:1.7}
.crl b{font-weight:800}
.heroTop{font-size:12px;color:rgba(255,255,255,.7);font-weight:600}
.heroName{font-size:26px;font-weight:800;line-height:1.15;margin:4px 0 2px;word-break:break-word}
.heroNum{font-size:56px;font-weight:800;line-height:1;color:var(--m);letter-spacing:-.02em}
/* susunan kartu: 1 kolom di HP, menyesuaikan lebar layar di desktop */
.gridc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px;align-items:start}
.gridc.cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.gridc>.card,.advgrid>.card{margin-bottom:0}
.gridc .span{grid-column:1/-1}
.gridc .chips{margin-bottom:0}
.advgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.fw{max-width:720px}
@media(min-width:860px){
  body{padding-bottom:0}
  body.shell{padding-left:240px}
  body.shell::before{content:'';position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--ch);z-index:40}
  body.shell .top{position:fixed;left:0;top:0;width:240px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;padding:24px 20px 8px}
  body.shell .top-in{max-width:none}
  body.shell .logo{background:var(--m);color:var(--ch)}
  body.shell .bn{color:#fff}body.shell .bs{color:rgba(255,255,255,.55)}
  body.shell .who{position:fixed;left:20px;bottom:22px;width:200px;margin:0;background:var(--ch2);color:var(--m);padding:12px 14px;text-align:left}
  body.shell .nav{position:fixed;left:0;top:96px;bottom:76px;width:240px;background:transparent;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:10px 14px;z-index:60}
  body.shell .nav-in{max-width:none;flex-direction:column;gap:4px}
  body.shell .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:12px 14px;border-radius:12px;color:rgba(255,255,255,.72)}
  body.shell .nav button:hover{background:var(--ch2)}
  body.shell .nav button.on{background:var(--m);color:var(--ch)}
  body.shell .nav button .ic{font-size:18px}
  body.shell .wrap{max-width:none;margin:0;padding:30px 36px 48px}
  .kpi{grid-template-columns:repeat(5,1fr)}.kpi .k.wide{grid-column:auto}
  .stat b{font-size:34px}.stat span{font-size:12px}
  .toast{bottom:28px}
  .advgrid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-areas:"tay que"}
  .a-que{grid-area:que}.a-tay{grid-area:tay}
}
</style>
</head>
<body>
<div class="top" id="top" style="display:none"><div class="top-in"><div class="logo">BC</div><div><div class="bn">Brand Creator</div><div class="bs">Kubah Emas · Creative ↔ Advertiser</div></div><button class="who" id="whobtn" onclick="switchWho()">—</button></div></div>
<div class="nav" id="nav" style="display:none"><div class="nav-in" id="navin"></div></div>
<div class="wrap" id="view"></div>
<div id="toastbox"></div>
<script>
// ═════════════ KONFIGURASI ═════════════
var APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbx7fvep5uCT_s_RUYbbcv4liCG0jRq5z53kzmz9BaL3QDTw2dI2PfZGo00UHhHnIPu0/exec';
var PEOPLE={
  Lukman:{role:'Manager · Advertiser',creator:true,adv:true,mgr:true},
  Dicky:{role:'Brand Creator',creator:true}
};
// "Hasil" mengikuti kolom Hasil di Meta Ads Manager (jenisnya tergantung objektif kampanye)
var JENIS=['Percakapan WA','ThruPlay','Klik tautan','Jangkauan'];
var KATS=['Awareness Online','Awareness Offline','Iklan Penjualan'];
var DIVISI=['Kubah Emas','Kumasindo'];
var ALASAN=['CTR rendah','Hasil rendah / CPL mahal','Creative jenuh','Budget dialihkan','Kampanye selesai / musiman','Lainnya'];
function isOff(c){return c.kategori==='Awareness Offline';}   // creative offline tidak diiklankan: tidak punya tayang/Hasil
var MONTH_ID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

// ═════════════ UTIL ═════════════
var S={ok:true,who:'',tab:'dash',loaded:false,err:'',kf:'',cdv:'',af:'',kd:false,ak:'',wk:'',wd:'',wo:'',sort:{},mt:null,cf:null,ed:null};
var D={creatives:[],tayang:[],targets:[],kills:[],keputusan:[],today:'',month:''};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function TD(){return D.today||dstr(new Date());}
function dDiff(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function dLabel(s){if(!s)return '—';var d=pd(s);return d.getDate()+' '+MONTH_ID[d.getMonth()].slice(0,3)+' '+d.getFullYear();}
function n0(n){return Math.round(n).toLocaleString('id-ID');}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(msg,bad){var t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=msg;$('toastbox').appendChild(t);setTimeout(function(){t.remove();},bad?5500:2200);}
function can(k){return !!(PEOPLE[S.who]&&PEOPLE[S.who][k]);}
function note(t,type){return '<div class="note '+(type||'')+'"><span>'+(type==='warn'?'⚠️':type==='bad'?'❌':type==='ok'?'✅':'ℹ️')+'</span><span>'+t+'</span></div>';}

// ═════════════ API ═════════════
function apiReady(){return APPS_SCRIPT_URL&&APPS_SCRIPT_URL.indexOf('PASTE_')!==0;}
function apiLoad(){
  return fetch(APPS_SCRIPT_URL+'?action=load&cb='+Date.now()).then(function(r){return r.json();}).then(function(j){
    if(!j.ok)throw new Error(j.error||'Server menolak permintaan');
    D={creatives:j.creatives||[],tayang:j.tayang||[],targets:j.targets||[],kills:j.kills||[],keputusan:j.keputusan||[],today:j.today||'',month:j.month||''};
  });
}
function apiPost(p){
  return fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({by:S.who},p))})
    .then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Gagal menyimpan');return j;});
}
function saveAndReload(p,okMsg){
  return apiPost(p).then(function(){return apiLoad();}).then(function(){toast(okMsg||'Tersimpan');render();return true;})
    .catch(function(e){var m=String(e.message||e);if(/tidak dikenal|PIN salah/.test(m))m='Server belum diperbarui: deploy ulang Apps Script terbaru.';toast(m,true);return false;});
}

// ═════════════ DATA TURUNAN ═════════════
function creativeOf(id){return D.creatives.filter(function(c){return c.id===id;})[0]||null;}
function tayOf(cid){return D.tayang.filter(function(t){return t.cid===cid;}).sort(function(a,b){return a.mulai<b.mulai?1:a.mulai>b.mulai?-1:0;});}
function tStatus(t){var td=TD();if(td<t.mulai)return 'Terjadwal';if(t.selesai&&td>t.selesai)return 'Selesai';return 'Berjalan';}
function tDays(t){var td=TD();if(td<t.mulai)return 0;var end=t.selesai&&t.selesai<td?t.selesai:td;return dDiff(t.mulai,end)+1;}
function jenisLabel(name){var n=String(name||'').trim().toLowerCase();for(var i=0;i<JENIS.length;i++)if(JENIS[i].toLowerCase()===n)return JENIS[i];return String(name||'').trim();}
function crStatus(c){
  var ts=tayOf(c.id);if(!ts.length)return {t:'na',x:'Belum tayang'};
  if(ts.some(function(t){return tStatus(t)==='Berjalan';}))return {t:'ok',x:'Berjalan'+(ts.length>1?' · '+ts.length+' tayang':'')};
  if(ts.every(function(t){return tStatus(t)==='Terjadwal';}))return {t:'warn',x:'Terjadwal'};
  return {t:'brand',x:'Selesai'+(ts.length>1?' · '+ts.length+' tayang':'')};
}
function kampanyeList(){   // kampanye unik, yang terbaru di depan
  var seen={},out=[];
  D.creatives.slice().sort(function(a,b){return a.created<b.created?1:-1;}).forEach(function(c){var k=c.kampanye.toLowerCase();if(!seen[k]){seen[k]=1;out.push(c.kampanye);}});
  D.tayang.slice().sort(function(a,b){return a.mulai<b.mulai?1:-1;}).forEach(function(t){if(!t.kampanye)return;var k=t.kampanye.toLowerCase();if(!seen[k]){seen[k]=1;out.push(t.kampanye);}});
  return out;
}
// kampanye sebuah tayang: kampanye tayang itu sendiri kalau diisi, kalau tidak ikut kampanye asal creative
function tKamp(t){if(t.kampanye)return t.kampanye;var c=creativeOf(t.cid);return c?c.kampanye:'';}
// kampanye tempat sebuah creative muncul: semua kampanye dari tayangnya; belum punya tayang = kampanye asal
function kampOf(c){
  var seen={},out=[];
  tayOf(c.id).forEach(function(t){var k=tKamp(t),kk=k.toLowerCase();if(k&&!seen[kk]){seen[kk]=1;out.push(k);}});
  if(!out.length)out.push(c.kampanye);
  return out;
}
function inKamp(c,key){return kampOf(c).some(function(k){return kampKey(k)===key;});}
function kampTags(c){return kampOf(c).map(function(k){return '<span class="tag brand">'+esc(k)+'</span>';}).join('');}
// Data per kampanye: creative terurut skor (Hasil) dari terbesar. Jenis hasil berbeda tidak dijumlahkan (ThruPlay ribuan akan menenggelamkan Percakapan WA).
function campData(){
  var camps={},jcount={};
  D.creatives.forEach(function(c){kampOf(c).forEach(function(kn){var k=kn.toLowerCase(),g=camps[k]||(camps[k]={name:kn,all:[],groups:{}});g.all.push(c);});});
  D.tayang.forEach(function(t){
    if(!t.jenis||t.hasil==null)return;
    var c=creativeOf(t.cid);if(!c)return;
    var camp=camps[tKamp(t).toLowerCase()],jl=jenisLabel(t.jenis),jk=jl.toLowerCase();
    var g=camp.groups[jk]||(camp.groups[jk]={label:jl,total:0,rows:{}});
    g.total+=t.hasil;
    var r=g.rows[c.id]||(g.rows[c.id]={c:c,hasil:0});r.hasil+=t.hasil;
  });
  Object.keys(camps).forEach(function(k){Object.keys(camps[k].groups).forEach(function(jk){jcount[jk]=(jcount[jk]||0)+Object.keys(camps[k].groups[jk].rows).length;});});
  var jorder=Object.keys(jcount).sort(function(a,b){return jcount[b]-jcount[a]||(a<b?-1:1);});
  var list=Object.keys(camps).map(function(k){
    var c=camps[k],scored={};
    c.garr=jorder.filter(function(jk){return c.groups[jk];}).map(function(jk){
      var g=c.groups[jk];g.list=Object.keys(g.rows).map(function(i){scored[i]=1;return g.rows[i];}).sort(function(a,b){return b.hasil-a.hasil||(a.c.nama<b.c.nama?-1:1);});return g;});
    c.unscored=c.all.filter(function(x){return !scored[x.id];}).sort(function(a,b){return a.nama<b.nama?-1:1;});
    return c;
  });
  addCtrLists(list);
  list.sort(function(a,b){
    if(!!a.garr.length!==!!b.garr.length)return a.garr.length?-1:1;
    for(var i=0;i<jorder.length;i++){var x=(a.groups[jorder[i]]||{total:0}).total,y=(b.groups[jorder[i]]||{total:0}).total;if(x!==y)return y-x;}
    return b.all.length-a.all.length||(a.name<b.name?-1:1);
  });
  return list;
}
function ctrFmt(x){return x.toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:2})+'%';}
// CTR tidak bisa dijumlahkan antar tayang: yang dipakai = CTR dari tayang TERBARU yang CTR-nya sudah diisi
// kk (opsional) = hanya hitung tayang di kampanye itu
function tayIn(cid,kk){return tayOf(cid).filter(function(t){return !kk||kampKey(tKamp(t))===kk;});}
function ctrOf(cid,kk){var ts=tayIn(cid,kk);for(var i=0;i<ts.length;i++)if(ts[i].ctr!=null)return ts[i].ctr;return null;}
function hasilStr(cid,kk){var sum={};tayIn(cid,kk).forEach(function(t){if(t.jenis&&t.hasil!=null){var j=jenisLabel(t.jenis);sum[j]=(sum[j]||0)+t.hasil;}});return Object.keys(sum).map(function(j){return '<b>'+n0(sum[j])+'</b> '+esc(j);}).join(' · ');}
function hasilTot(cid,kk){var n=0;tayIn(cid,kk).forEach(function(t){if(t.hasil!=null)n+=t.hasil;});return n;}
function addCtrLists(list){
  list.forEach(function(c){
    var ck=kampKey(c.name),a=c.all.map(function(x){return {c:x,ctr:ctrOf(x.id,ck)};});
    c.ctrList=a.filter(function(r){return r.ctr!=null;}).sort(function(p,q){return q.ctr-p.ctr||hasilTot(q.c.id,ck)-hasilTot(p.c.id,ck)||(p.c.nama<q.c.nama?-1:1);});
    c.noCtr=a.filter(function(r){return r.ctr==null;}).map(function(r){return r.c;}).sort(function(p,q){return p.nama<q.nama?-1:1;});
  });
  return list;
}
// hitung jumlah creative: total, per kategori, per divisi, dan kategori x divisi
function tally(list){
  var t={total:list.length,div:{},kat:{},nodiv:0,nokat:0};
  DIVISI.forEach(function(d){t.div[d]=0;});
  KATS.forEach(function(k){t.kat[k]={n:0,d:{}};DIVISI.forEach(function(d){t.kat[k].d[d]=0;});});
  list.forEach(function(c){
    var hd=t.div[c.divisi]!==undefined;if(hd)t.div[c.divisi]++;else t.nodiv++;
    var kk=t.kat[c.kategori];if(kk){kk.n++;if(hd)kk.d[c.divisi]++;}else t.nokat++;
  });
  return t;
}
function MON(){return D.month||TD().slice(0,7);}
function nextMon(m){var a=m.split('-'),y=+a[0],mo=+a[1]+1;if(mo>12){mo=1;y++;}return y+'-'+String(mo).padStart(2,'0');}
function monLabel(m){var a=m.split('-');return MONTH_ID[+a[1]-1]+' '+a[0];}
function tgtOf(m,k,d){var r=D.targets.filter(function(x){return x.bulan===m&&x.kategori===k&&x.divisi===d;})[0];return r?r.jumlah:null;}
function hasTgt(m){return D.targets.some(function(x){return x.bulan===m&&x.kategori!==WK;});}
function kampKey(n){return String(n||'').toLowerCase();}
function killRec(tipe,target){return D.kills.filter(function(k){return k.tipe===tipe&&k.target===target;})[0]||null;}
// KILL efektif sebuah creative: KILL sendiri, atau ikut kampanyenya
function killOf(c){

function killPre(k){return k.src==='kampanye'?' (kampanye "'+k.kname+'")':'';}
function killTxt(k){return k.alasan+(k.catatan?' — '+k.catatan:'');}
function killBox(k,pre){return '<div class="killbox"><b>KILL</b>'+(pre||'')+' · '+esc(killTxt(k))+'<div class="sm" style="opacity:.8">Oleh '+esc(k.by)+' · '+dLabel((k.ts||'').slice(0,10))+'</div></div>';}
function dKill(c){var k=killRec('creative',c.id);return k?' · <b style="color:var(--bad)">KILL: '+esc(k.alasan)+'</b>':'';}
function inMonth(m){return D.creatives.filter(function(c){return (c.created||'').slice(0,7)===m;});}

// ═════════════ KINERJA BRAND CREATOR (Winner) ═════════════
var WK='__winner__';   // baris khusus di tab Target = target jumlah Winner per bulan
function tgtW(m){var r=D.targets.filter(function(x){return x.bulan===m&&x.kategori===WK;})[0];return r?r.jumlah:null;}
var CTR_MIN=1, CPM_MAX=15000;   // kriteria keberhasilan creative: CTR ≥ 1% dan CPM ≤ Rp15.000
function tayStarted(c){var td=TD();return tayOf(c.id).filter(function(t){return t.mulai<=td;});}
function tayLolos(t){return t.ctr!=null&&t.cpm!=null&&t.ctr>=CTR_MIN&&t.cpm<=CPM_MAX;}
// lolos = minimal satu tayang memenuhi CTR dan CPM sekaligus; belum = ada tayang yang datanya belum lengkap (tidak dihitung gagal); gagal = semua tayang lengkap tapi tidak ada yang lolos
function critOf(c){
  var ts=tayStarted(c);if(!ts.length)return 'belum';
  if(ts.some(tayLolos))return 'lolos';
  return ts.some(function(t){return t.ctr==null||t.cpm==null;})?'belum':'gagal';
}
function kepOf(cid){return D.keputusan.filter(function(k){return k.cid===cid;})[0]||null;}
function isWin(c){var k=kepOf(c.id);return !!k&&k.status==='WINNER';}
function firstStart(c){var td=TD(),best='';tayOf(c.id).forEach(function(t){if(t.mulai<=td&&(!best||t.mulai<best))best=t.mulai;});return best;}   // tanggal tayang pertama yang sudah mulai
function dKep(c){var k=kepOf(c.id);if(!k)return '';return ' · <b style="color:'+(k.status==='WINNER'?'var(--ok)':'var(--m-d)')+'">'+k.status+'</b>';}
function kepTag(c){
  if(isOff(c)||!firstStart(c))return '';
  var k=kepOf(c.id);
  if(k)return '<span class="tag '+(k.status==='WINNER'?'ok':'brand')+'">'+k.status+'</span>';
  return killOf(c)?'':'<span class="tag warn">Belum diputuskan</span>';
}
function paceOf(m){
  var a=m.split('-'),dim=new Date(+a[0],+a[1],0).getDate(),td=TD();
  if(td.slice(0,7)>m)return {p:1,day:dim,dim:dim};
  var d=+td.slice(8);return {p:d/dim,day:d,dim:dim};
}
// angka kinerja satu bulan. "Diuji" dan "Winner" dikelompokkan menurut bulan tayang pertama creative (creative online saja)
function bcStats(m){
  var tested=D.creatives.filter(function(c){return !isOff(c)&&firstStart(c).slice(0,7)===m;});
  var win=tested.filter(isWin),kr={lolos:0,gagal:0,belum:0};tested.forEach(function(c){kr[critOf(c)]++;});
  var undec=tested.filter(function(c){return !kepOf(c.id)&&!killOf(c);});
  var gt=0;KATS.forEach(function(k){DIVISI.forEach(function(d){gt+=tgtOf(m,k,d)||0;});});
  var backlog=D.creatives.filter(function(c){return !isOff(c)&&firstStart(c)&&!kepOf(c.id)&&!killOf(c);}).length;
  return {made:inMonth(m).length,gt:gt,hasT:hasTgt(m)&&gt>0,tw:tgtW(m),tested:tested,win:win,kr:kr,undec:undec,backlog:backlog,pace:paceOf(m)};
}
// status: Dibuat dan Winner dibandingkan dengan target yang diharapkan sampai hari ini (pro-rata hari berjalan)
function bcStatus(s){
  if(!s.hasT)return {k:'na',x:'Target creative belum diisi',why:[]};
  if(s.tw==null)return {k:'na',x:'Target Winner belum diisi',why:[]};
  var p=s.pace.p,expA=s.gt*p,expB=s.tw*p,A=s.made/expA,B=s.tw>0?s.win.length/expB:1,why=[];
  var e1=function(x){return (Math.round(x*10)/10).toLocaleString('id-ID');};
  if(A<0.8)why.push('Creative dibuat '+s.made+', kurang dari 80% dari '+e1(expA)+' yang diharapkan sampai hari ini');
  if(B<0.5)why.push('Winner '+s.win.length+', kurang dari 50% dari '+e1(expB)+' yang diharapkan sampai hari ini');
  if(why.length)return {k:'bad',x:'UNDER PERFORM',why:why};
  if(A>=1&&B>=1)return {k:'ok',x:'PERFORM BANGET',why:[]};
  if(A<1)why.push('Creative dibuat '+s.made+' dari '+e1(expA)+' yang diharapkan: belum 100%');
  if(B<1)why.push('Winner '+s.win.length+' dari '+e1(expB)+' yang diharapkan: belum 100%');
  return {k:'brand',x:'PERFORM',why:why};
}
function kpiTile(v,lbl,sub,wide){return '<div class="k'+(wide?' wide':'')+'"><b>'+v+'</b><span>'+lbl+'</span><div class="sub">'+sub+'</div></div>';}
function vKpi(m){

    '<span class="stt '+st.k+'">'+esc(st.x)+'</span>'+(interim&&st.k!=='na'?' <span class="sm mut" style="margin-left:6px">sementara · hari ke-'+s.pace.day+' dari '+s.pace.dim+'</span>':'')+'</div></div>';

  if(st.k==='na'&&can('mgr'))h+='<div class="sm mut" style="margin-top:8px"><a href="#" onclick="goTab(\'mgr\');return false" style="color:var(--m-d);font-weight:800">Isi target di tab Manager →</a></div>';

    kpiTile(String(s.tested.length),'Creative Sudah Diuji','tayang pertama bulan ini'+(s.undec.length?' · '+s.undec.length+' belum diputuskan':''))+

    kpiTile(rate,'Winner Rate','Winner ÷ Diuji'+(s.tested.length?' · '+s.win.length+' dari '+s.tested.length:''))+
    kpiTile((s.kr.lolos+s.kr.gagal)?s.kr.lolos+' <small>/ '+(s.kr.lolos+s.kr.gagal)+'</small>':'—','Lolos Kriteria','CTR ≥ '+CTR_MIN+'% dan CPM ≤ Rp'+n0(CPM_MAX)+(s.kr.belum?' · '+s.kr.belum+' belum lengkap datanya':''),true)+
    '</div>';
  h+='<details class="cara"><summary>Cara hitung</summary><ul>'+
    '<li><b>Dibuat</b>: semua creative yang dicatat bulan ini (termasuk Awareness Offline) dibanding target creative.</li>'+
    '<li><b>Diuji</b>: creative online yang tayang pertamanya mulai bulan ini. Awareness Offline tidak diiklankan, jadi tidak dihitung.</li>'+
    '<li><b>Winner</b>: ditetapkan Advertiser dari creative yang diuji, dengan alasan. Ranking #1 tidak otomatis Winner. Winner yang kemudian di-KILL tetap dihitung Winner.</li>'+
    '<li><b>Winner Rate</b> = Winner ÷ Diuji × 100%. Creative yang belum diputuskan ikut jadi pembagi, jadi angkanya naik setelah Advertiser memutuskan.</li>'+
    '<li><b>Lolos Kriteria</b>: creative yang diuji dan minimal satu tayangnya punya CTR ≥ '+CTR_MIN+'% <u>dan</u> CPM ≤ Rp'+n0(CPM_MAX)+' sekaligus. Creative yang CTR atau CPM-nya belum diisi tidak dihitung gagal, hanya dicatat "belum lengkap". Angka ini informasi, belum menentukan status.</li>'+
    '<li><b>UNDER PERFORM</b>: Dibuat &lt; 80% atau Winner &lt; 50% dari yang diharapkan sampai hari ini. <b>PERFORM BANGET</b>: Dibuat ≥ 100% dan Winner ≥ 100%. Selain itu <b>PERFORM</b>.</li>'+
    '<li>Yang diharapkan sampai hari ini = target × (hari berjalan ÷ jumlah hari bulan ini). Status berlabel "sementara" sampai akhir bulan.</li>'+

  if(can('adv')&&s.backlog)h+=note(s.backlog+' creative sudah tayang tapi belum diputuskan (semua bulan). Buka tab Advertiser, pilih WINNER, LANJUT, atau KILL.','warn');
  return h;
}

// ═════════════ KAMPANYE BULAN INI ═════════════
// kampanye "bulan ini" = kampanye yang punya tayang (creative online) yang bersinggungan dengan bulan itu.
// status: KILL (kampanye di-KILL) > Berjalan (ada tayang berjalan hari ini) > Terjadwal (belum ada yang berjalan, ada yang akan mulai bulan ini) > Selesai.
// "Belum tayang" = kampanye dengan creative yang dicatat bulan ini tapi belum punya tayang sama sekali (di luar hitungan utama).
function kampBulan(m){
  var ms=m+'-01',me=m+'-31',map={};
  D.tayang.forEach(function(t){
    var c=creativeOf(t.cid);if(!c||isOff(c))return;
    if(t.mulai>me||(t.selesai&&t.selesai<ms))return;
    var nm=tKamp(t),k=kampKey(nm),g=map[k]||(map[k]={name:nm,key:k,run:0,sch:0,done:0,cr:{},first:t.mulai,last:'',open:false});
    var st=tStatus(t);if(st==='Berjalan')g.run++;else if(st==='Terjadwal')g.sch++;else g.done++;
    g.cr[t.cid]=1;if(t.mulai<g.first)g.first=t.mulai;
    if(!t.selesai)g.open=true;else if(t.selesai>g.last)g.last=t.selesai;
  });
  var list=Object.keys(map).map(function(k){var g=map[k],kl=killRec('kampanye',k);g.n=Object.keys(g.cr).length;g.kill=kl;g.st=kl?'KILL':g.run?'Berjalan':g.sch?'Terjadwal':'Selesai';return g;});
  var ord={Berjalan:0,Terjadwal:1,Selesai:2,KILL:3};
  list.sort(function(a,b){return ord[a.st]-ord[b.st]||(a.name<b.name?-1:1);});
  var pend={};
  inMonth(m).forEach(function(c){if(isOff(c)||tayOf(c.id).length)return;var k=kampKey(c.kampanye);if(!map[k]&&!killRec('kampanye',k)){pend[k]=pend[k]||{name:c.kampanye,n:0};pend[k].n++;}});
  var cnt={Berjalan:0,Terjadwal:0,Selesai:0,KILL:0};list.forEach(function(g){cnt[g.st]++;});
  return {list:list,cnt:cnt,pend:Object.keys(pend).map(function(k){return pend[k];})};
}
function vKampBulan(m){
  var kb=kampBulan(m),hasilBy={};
  campData().forEach(function(c){hasilBy[kampKey(c.name)]=c.garr.map(function(g){return '<b>'+n0(g.total)+'</b> '+esc(g.label);}).join(' · ');});
  var tg=kb.list.length;
  var h='<div class="card"><div class="h">Kampanye bulan ini · '+esc(monLabel(m))+'</div>'+
    '<div class="row" style="align-items:flex-end;gap:14px"><div><div class="heroNum" style="color:var(--m-d);font-size:44px;line-height:1">'+kb.cnt.Berjalan+'</div><div class="sm" style="font-weight:700;margin-top:4px">kampanye berjalan</div></div>'+
    '<div class="sm mut" style="flex:1;padding-bottom:4px">dari '+tg+' kampanye yang tayang bulan ini</div></div>'+
    '<div class="tags" style="margin-top:10px"><span class="tag ok">Berjalan '+kb.cnt.Berjalan+'</span><span class="tag warn">Terjadwal '+kb.cnt.Terjadwal+'</span><span class="tag brand">Selesai '+kb.cnt.Selesai+'</span><span class="tag bad">KILL '+kb.cnt.KILL+'</span>'+(kb.pend.length?'<span class="tag na">Belum tayang '+kb.pend.length+'</span>':'')+'</div>';
  if(!tg)h+='<div class="empty">Belum ada kampanye yang tayang bulan ini.</div>';
  kb.list.forEach(function(g){
    var tt=g.st==='Berjalan'?'ok':g.st==='Terjadwal'?'warn':g.st==='KILL'?'bad':'brand';
    h+='<div class="item"><div class="row"><div class="kr-t">'+esc(g.name)+'</div><span class="tag '+tt+' sp">'+g.st+'</span></div>'+
      '<div class="sm mut" style="margin-top:3px">'+g.n+' creative'+(g.run?' · '+g.run+' tayang berjalan':'')+' · '+dLabel(g.first)+' → '+(g.open?'sekarang':dLabel(g.last))+'</div>'+
      (hasilBy[g.key]?'<div class="sm" style="margin-top:3px">Hasil '+hasilBy[g.key]+'</div>':'')+
      (g.kill?'<div class="sm" style="margin-top:3px;color:var(--bad)">KILL: '+esc(g.kill.alasan)+'</div>':'')+'</div>';
  });
  if(kb.pend.length)h+='<div class="sm mut" style="margin-top:10px">Belum tayang (creative sudah masuk, belum diatur tayangnya): '+kb.pend.map(function(x){return esc(x.name)+' ('+x.n+')';}).join(', ')+'</div>';
  return h+'</div>';
}

// ═════════════ SHELL ═════════════
function pickWho(){

function goTab(t){S.tab=t;S.cf=null;S.ed=null;S.mt=null;render();window.scrollTo(0,0);}
function errHint(m){
  if(/PIN salah/.test(m))return 'Apps Script yang ter-deploy masih versi lama (masih meminta PIN). Tempel kode Apps Script terbaru, lalu Deploy → Manage deployments → Edit → Version: <b>New</b> → Deploy.';
  if(/Masih versi lama|masih versi lama/.test(m))return 'Tab di Spreadsheet masih dari versi lama. <b>Hapus tab Creative, Tayang, dan Config</b> di Spreadsheet, lalu tekan Coba lagi (tab baru dibuat otomatis).';
  if(/Unexpected token|JSON|DOCTYPE|<html/i.test(m))return 'Server membalas halaman web, bukan data. Biasanya akses deploy belum <b>Anyone</b>, atau URL belum menunjuk ke versi terbaru. Di Apps Script: Deploy → Manage deployments → Edit → Version: <b>New</b> → Deploy, pastikan "Who has access" = Anyone, lalu pastikan URL yang dipakai berakhiran <b>/exec</b>.';
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return 'App tidak bisa menghubungi Apps Script. Cek koneksi internet. Kalau koneksi normal, biasanya akses deploy belum <b>Anyone</b> atau URL salah (harus berakhiran /exec).';
  if(/tidak terhubung ke Spreadsheet|null|getActiveSpreadsheet|openById|Unexpected sheet|not found|tidak ditemukan/i.test(m))return 'Script tidak bisa membuka Spreadsheet. Pastikan <b>SHEET_ID</b> di bagian atas kode Apps Script berisi ID Spreadsheet yang benar, lalu Deploy → Version: New.';
  if(/izin|permission|authoriz|Exception/i.test(m))return 'Script belum diberi izin. Di editor Apps Script, pilih fungsi <b>authorize_</b>, klik Run, setujui izin, lalu Deploy → Version: New.';
  return 'Kirim pesan di atas ke Lukman/pembuat app supaya bisa dilacak.';
}
function render(){
  if(!S.ok||!S.who)return;
  nav();
  if(S.err&&!S.loaded){$('view').innerHTML='<div class="card fw"><div class="mid" style="margin-bottom:8px">Gagal memuat data</div><div class="sm" style="margin-bottom:8px;font-weight:700;color:var(--bad)">'+esc(S.err)+'</div><div class="sm mut" style="margin-bottom:6px">'+errHint(String(S.err))+'</div><button class="btn" onclick="start()">Coba lagi</button></div>';return;}
  $('view').innerHTML=S.tab==='cr'?vCreative():S.tab==='adv'?vAdv():S.tab==='win'?vWin():S.tab==='mgr'?vMgr():vDash();
}

    KATS.forEach(function(k){

      tg+='<div class="item"><div class="row"><div class="kr-t">'+esc(k)+'</div><div class="sp fr" style="font-size:18px"><span'+(tk&&tm.kat[k].n>=tk?' style="color:var(--ok)"':'')+'>'+tm.kat[k].n+'</span> <small>/ '+n0(tk)+'</small></div></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="sm mut" style="margin-top:6px">'+parts.join(' · ')+'</div></div>';

  if(!cd.some(function(c){return c.garr.length;}))h+=note('Belum ada Hasil. Hasil dan CTR diisi Advertiser di tab Advertiser setelah iklan tayang.');

    var mode=S.sort[CK[ci]]==='ctr'?'ctr':'hasil';

      '<div class="sm mut" style="margin-top:4px">'+c.all.length+' creative'+(c.garr.length===1?' · total <b style="color:var(--txt)">'+n0(c.garr[0].total)+'</b> '+esc(c.garr[0].label):'')+'</div></div></div>'+

    if(mode==='hasil'){
      c.garr.forEach(function(g){
        var max=g.list[0].hasil||1;

        h+=g.list.map(function(r,i){

            '<div class="sm mut" style="margin-top:2px">'+esc([r.c.divisi,r.c.kategori||'Belum dikategorikan'].filter(Boolean).join(' · '))+(cx!=null?' · CTR '+ctrFmt(cx):'')+dKill(r.c)+dKep(r.c)+'</div></div><div class="num">'+n0(r.hasil)+'</div></div><div class="rbar"><i style="width:'+w+'%"></i></div></div>';
        }).join('');
      });
      if(c.unscored.length)h+='<div class="sm mut" style="margin-top:12px;line-height:1.7">'+(scored?'Belum ada Hasil: ':'Belum ada Hasil untuk: ')+c.unscored.map(function(x){return esc(x.nama)+(isOff(x)?' (offline, tanpa Hasil)':'');}).join(', ')+'</div>';
    }else{
      var maxc=c.ctrList.length?(c.ctrList[0].ctr||1):1;
      if(!c.ctrList.length)h+='<div class="sm mut" style="margin-top:12px">Belum ada CTR yang diisi untuk kampanye ini.</div>';
      h+=c.ctrList.map(function(r,i){
        var w=r.ctr>0?Math.max(3,Math.round(r.ctr/maxc*100)):0,hs=hasilStr(r.c.id,kampKey(c.name));
        return '<div class="item rrow'+(i===0?' best':'')+'"><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><div class="kr-t"><span class="rk">#'+(i+1)+'</span> '+esc(r.c.nama)+'</div>'+
          '<div class="sm mut" style="margin-top:2px">'+esc([r.c.divisi,r.c.kategori||'Belum dikategorikan'].filter(Boolean).join(' · '))+(hs?' · Hasil '+hs:'')+dKill(r.c)+dKep(r.c)+'</div></div><div class="num">'+ctrFmt(r.ctr)+'</div></div><div class="rbar"><i style="width:'+w+'%"></i></div></div>';
      }).join('');
      if(c.noCtr.length)h+='<div class="sm mut" style="margin-top:12px;line-height:1.7">'+(c.ctrList.length?'Belum ada CTR: ':'Creative: ')+c.noCtr.map(function(x){return esc(x.nama)+(isOff(x)?' (offline, tanpa CTR)':'');}).join(', ')+'</div>';
      if(c.ctrList.length)h+='<div class="sm mut" style="margin-top:10px">Kalau satu creative punya beberapa tayang, CTR yang dipakai dari tayang terbaru.</div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}

function cfSave(){
  cfSync();var f=S.cf;

  if(!f.kamp.trim()){toast('Isi untuk kampanye apa',true);return;}

function killCard(dead){
  if(!dead.length)return '';
  var h='<div class="card" style="margin-top:14px"><div class="h">Di-KILL ('+dead.length+' creative)</div>';
  dead.forEach(function(c){

function killCr(id){var c=creativeOf(id);if(!c)return;killOpen({tipe:'creative',target:id,cid:id,label:'Creative "'+c.nama+'"'});}
function killPick(i){edSync();S.ed.alasan=ALASAN[i];render();var e=$('edbox');if(e)e.scrollIntoView({block:'center'});}
function runCount(tipe,target){
  var run=0,sch=0;
  D.tayang.forEach(function(t){if(tipe==='creative'?t.cid!==target:kampKey(tKamp(t))!==target)return;var st=tStatus(t);if(st==='Berjalan')run++;else if(st==='Terjadwal')sch++;});
  return {run:run,sch:sch};
}
function killSave(){
  edSync();var e=S.ed;
  if(!e.alasan){toast('Pilih alasan KILL',true);return;}
  if(e.alasan==='Lainnya'&&!String(e.catatan||'').trim()){toast('Alasan "Lainnya" wajib diberi catatan',true);return;}
  var rc=runCount(e.tipe,e.target);
  if(!confirm('KILL '+e.label+'?\n'+rc.run+' tayang berjalan dihentikan hari ini, '+rc.sch+' tayang terjadwal dibatalkan. Hasil dan CTR yang sudah ada tetap tersimpan.'))return;
  $('ed_save').disabled=true;
  saveAndReload({action:'kill',tipe:e.tipe,target:e.target,alasan:e.alasan,catatan:String(e.catatan||'').trim()},'KILL tersimpan').then(function(ok){if(ok){S.ed=null;render();}else{var b=$('ed_save');if(b)b.disabled=false;}});
}
function reviveKamp(i){var k=KK[i];if(k===undefined)return;if(!confirm('Hidupkan lagi kampanye "'+k+'"? Tayang yang sudah dihentikan tidak menyala otomatis.'))return;saveAndReload({action:'revive',tipe:'kampanye',target:kampKey(k)},'Kampanye dihidupkan lagi');}
function reviveCr(id){var c=creativeOf(id);if(!c)return;if(!confirm('Hidupkan lagi creative "'+c.nama+'"? Tayang yang sudah dihentikan tidak menyala otomatis.'))return;saveAndReload({action:'revive',tipe:'creative',target:id},'Creative dihidupkan lagi');}
function divTag(c){return c.divisi?'<span class="tag dv">'+esc(c.divisi)+'</span>':'<span class="tag warn">Belum ada divisi</span>';}
// daftar creative dikelompokkan per divisi (kalau filter divisi aktif: satu kelompok saja, tanpa judul)
function advPass(c){return (!S.af||c.divisi===S.af)&&(!S.ak||inKamp(c,kampKey(S.ak)));}
function primKamp(c){var ts=tayOf(c.id);return ts.length?tKamp(ts[0]):c.kampanye;}   // kampanye tayang terbaru; antrean = kampanye asal
// dikelompokkan per kampanye. Satu creative muncul sekali (di kampanye tayang terbarunya); kalau satu kampanye dipilih, semuanya masuk kampanye itu
function advList(list,fn){
  var g={},order=[];
  list.filter(advPass).forEach(function(c){var k=S.ak||primKamp(c),kk=kampKey(k);if(!g[kk]){g[kk]={name:k,items:[]};order.push(kk);}g[kk].items.push(c);});
  var rank=kampanyeList().map(kampKey);
  order.sort(function(a,b){return (rank.indexOf(a)<0?999:rank.indexOf(a))-(rank.indexOf(b)<0?999:rank.indexOf(b));});
  return order.map(function(kk){var x=g[kk];return (S.ak?'':'<div class="dvh">'+esc(x.name||'Tanpa kampanye')+' · '+x.items.length+'</div>')+x.items.map(fn).join('');}).join('');
}
function lastKamp(cid){var ts=tayOf(cid);if(ts.length)return tKamp(ts[0]);var c=creativeOf(cid);return c?c.kampanye:'';}
function newTayang(cid){edOpen({type:'tayang',cid:cid,id:'',mulai:TD(),selesai:'',kamp:lastKamp(cid),knew:''});}
var KP=[];
function kPick(i){edSync();S.ed.kamp=KP[i];S.ed.knew='';render();}

      (can('adv')?'<div class="acts"><button class="btn s" onclick="newTayang(\''+c.id+'\')">Atur tayang</button><button class="btn s danger" onclick="killCr(\''+c.id+'\')">KILL — Hentikan</button></div>':'')+edBoxFor(c.id,'')+'</div>';
  });

  if(!ln)h+='<div class="empty">'+(S.kd?'Semua creative yang sudah tayang sudah diputuskan.':'Belum ada tayang'+(S.ak||S.af?' untuk '+esc(S.ak||S.af):'')+'.')+'</div>';
  h+=advList(live.filter(function(c){return !S.kd||(firstStart(c)&&!kepOf(c.id));}),function(c){

    if(can('adv'))x+='<div class="acts">'+(firstStart(c)?'<button class="btn s win" onclick="kepOpen(\''+c.id+'\',\'WINNER\')">WINNER — Replikasi</button><button class="btn s ghost" onclick="kepOpen(\''+c.id+'\',\'LANJUT\')">LANJUT — Masih diuji</button>':'')+'<button class="btn s ghost" onclick="newTayang(\''+c.id+'\')">+ Tayang baru</button><button class="btn s danger" onclick="killCr(\''+c.id+'\')">KILL — Hentikan</button></div>'+edBoxFor(c.id,'');
    return x+'</div>';
  });
  h+='</div></div>';
  return h+killCard(dead);

      (isX?'<input class="inp" style="margin-top:8px" id="ed_jx" maxlength="40" value="'+esc(e.jx||'')+'" placeholder="mis. Pembelian">':'')+
      '<label class="lbl">Hasil</label><input class="inp huge" type="number" inputmode="numeric" min="0" step="1" id="ed_hasil" value="'+esc(e.hasil)+'" placeholder="0">'+
      '<div class="sm mut" style="margin-top:8px">Isi <b>total sejak mulai tayang</b>, bukan per hari. Di Meta, atur rentang tanggal sama dengan periode tayang ini.</div>'+
      '<label class="lbl">CTR (%) dari kolom CTR di Meta, boleh dikosongkan</label><input class="inp" type="number" inputmode="decimal" min="0" max="100" step="0.01" id="ed_ctr" value="'+esc(e.ctr||'')+'" placeholder="mis. 1,25">'+
      '<label class="lbl">CPM (Rp) dari kolom CPM di Meta, boleh dikosongkan</label><input class="inp" type="number" inputmode="numeric" min="0" max="1000000" step="1" id="ed_cpm" value="'+esc(e.cpm||'')+'" placeholder="mis. 12500">'+
      '<button class="btn" id="ed_save" onclick="saveHasil()">Simpan Hasil</button><button class="btn ghost" onclick="edClose()">Batal</button></div>';
  }
  if(e.type==='kep'){
    var kc=creativeOf(e.cid),hs=kc?hasilStr(kc.id,''):'',cx=kc?ctrOf(kc.id,''):null,win=e.status==='WINNER';
    return '<div class="fbox" id="edbox"><div class="h">Keputusan · '+esc(kc?kc.nama:'')+'</div>'+
      '<div class="sm" style="margin-bottom:10px">'+(hs?'Hasil: '+hs:'<span style="color:var(--warn)">Hasil belum diisi</span>')+(cx!=null?' · CTR <b>'+ctrFmt(cx)+'</b>':'')+'</div>'+
      (kc?'<div class="sm" style="margin-bottom:10px">'+(critOf(kc)==='lolos'?'<span style="color:var(--ok);font-weight:800">✓ Memenuhi kriteria</span>':critOf(kc)==='gagal'?'<span style="color:var(--warn);font-weight:800">Di luar kriteria</span>, jelaskan alasannya kalau tetap dijadikan Winner':'<span style="color:var(--warn);font-weight:800">CTR/CPM belum lengkap</span>')+' <span class="mut">(CTR ≥ '+CTR_MIN+'% · CPM ≤ Rp'+n0(CPM_MAX)+')</span></div>':'')+
      '<div class="chips" style="margin-bottom:0"><button class="chip '+(win?'on':'')+'" onclick="kepPick(\'WINNER\')">WINNER — Replikasi</button><button class="chip '+(!win?'on':'')+'" onclick="kepPick(\'LANJUT\')">LANJUT — Masih diuji</button></div>'+
      '<label class="lbl">'+(win?'Alasan Winner *':'Catatan (opsional)')+'</label><textarea class="ta" id="ed_cat" maxlength="200" placeholder="'+(win?'mis. CPL Rp 9.800, CTR 1,6%, layak dibuat versi lain':'mis. baru 3 hari tayang, tunggu data')+'">'+esc(e.catatan||'')+'</textarea>'+
      '<div class="sm mut" style="margin-top:8px">'+(win?'Winner = creative yang hasilnya cukup baik dan layak dibuat versi turunannya. Creative ini akan muncul di tab Winner beserta alasannya. Ranking #1 tidak otomatis Winner.':'LANJUT = creative masih diuji, belum layak jadi Winner dan belum perlu dihentikan.')+'</div>'+
      '<button class="btn'+(win?' win':'')+'" id="ed_save" onclick="kepSave()">'+(win?'Tetapkan Winner':'Simpan LANJUT')+'</button><button class="btn ghost" onclick="edClose()">Batal</button></div>';
  }
  if(e.type==='kill')return '<div class="fbox" id="edbox"><div class="h">KILL · '+esc(e.label)+'</div><label class="lbl">Alasan *</label><div class="chips" style="margin-bottom:0">'+
      ALASAN.map(function(a,i){return '<button class="chip '+(e.alasan===a?'on':'')+'" onclick="killPick('+i+')">'+esc(a)+'</button>';}).join('')+'</div>'+
      '<label class="lbl">Catatan '+(e.alasan==='Lainnya'?'*':'(opsional)')+'</label><textarea class="ta" id="ed_cat" maxlength="300" placeholder="mis. CPL Rp 38.000, jauh di atas target">'+esc(e.catatan||'')+'</textarea>'+
      '<div class="sm mut" style="margin-top:8px">Tayang yang berjalan dihentikan hari ini. Hasil dan CTR tetap tersimpan. Brand Creator melihat tanda KILL dan alasan ini, bukan angka performa.</div>'+
      '<button class="btn kill" id="ed_save" onclick="killSave()">KILL</button><button class="btn ghost" onclick="edClose()">Batal</button></div>';
  return '';
}
function ubahTayang(tid){
  var t=D.tayang.filter(function(x){return x.id===tid;})[0];if(!t)return;
  edOpen({type:'tayang',cid:t.cid,id:t.id,mulai:t.mulai,selesai:t.selesai,kamp:tKamp(t),k0:tKamp(t),knew:''});
}
function hasilOpen(tid){
  var t=D.tayang.filter(function(x){return x.id===tid;})[0];if(!t)return;
  var known=t.jenis&&JENIS.some(function(j){return j.toLowerCase()===t.jenis.toLowerCase();});
  var jk=known?jenisLabel(t.jenis):(t.jenis?'__x':JENIS[0]);
  edOpen({type:'hasil',cid:t.cid,id:t.id,mulai:t.mulai,selesai:t.selesai,jenis:jk,jx:known?'':(t.jenis||''),hasil:t.hasil==null?'':String(t.hasil),ctr:t.ctr==null?'':String(t.ctr),cpm:t.cpm==null?'':String(t.cpm)});
}
function saveTayang(){
  edSync();var e=S.ed;
  if(!e.mulai){toast('Tanggal mulai tayang wajib diisi',true);return;}
  if(e.selesai&&e.selesai<e.mulai){toast('Tanggal selesai tidak boleh sebelum mulai',true);return;}
  var kn=(String(e.knew||'').trim()||e.kamp||'').trim();
  if(!kn){toast('Pilih atau ketik kampanye untuk tayang ini',true);return;}
  var kr=killRec('kampanye',kampKey(kn));
  if(kr&&!(e.id&&kampKey(kn)===kampKey(e.k0))){toast('Kampanye "'+kn+'" sedang di-KILL. Pilih kampanye lain atau hidupkan dulu',true);return;}
  $('ed_save').disabled=true;
  saveAndReload({action:'tayang',id:e.id||uid('t'),cid:e.cid,mulai:e.mulai,selesai:e.selesai||'',kampanye:kn},'Tayang tersimpan').then(function(ok){if(ok){S.ed=null;render();}else{var b=$('ed_save');if(b)b.disabled=false;}});
}
function saveHasil(){
  edSync();var e=S.ed;
  var j=e.jenis==='__x'?String(e.jx||'').trim():e.jenis;
  if(!j){toast('Isi jenis hasil',true);return;}
  if(e.hasil===''){toast('Isi angka Hasil (isi 0 kalau memang 0)',true);return;}
  if(!/^\d+$/.test(String(e.hasil))){toast('Hasil harus bilangan bulat tanpa titik/koma',true);return;}
  var cx=String(e.ctr==null?'':e.ctr).trim().replace(',','.');
  var pm=String(e.cpm==null?'':e.cpm).trim().replace(',','.');
  if(cx!==''&&(isNaN(+cx)||+cx<0||+cx>100)){toast('CTR harus angka 0 sampai 100 (persen)',true);return;}
  $('ed_save').disabled=true;
  saveAndReload({action:'tayang',id:e.id,cid:e.cid,mulai:e.mulai,selesai:e.selesai||'',jenis:j,hasil:+e.hasil,ctr:cx===''?null:+cx,cpm:pm===''?null:+pm},'Hasil, CTR & CPM tersimpan').then(function(ok){if(ok){S.ed=null;render();}else{var b=$('ed_save');if(b)b.disabled=false;}});
}
function tStop(id){
  var t=D.tayang.filter(function(x){return x.id===id;})[0];if(!t)return;
  if(!confirm('Hentikan tayang ini hari ini ('+dLabel(TD())+')?'))return;
  saveAndReload({action:'tayang',id:t.id,cid:t.cid,mulai:t.mulai,selesai:TD()},'Tayang dihentikan');
}
function tDel(id){
  if(!confirm('Hapus tayang ini? Hasil yang sudah diisi ikut hilang dari dashboard.'))return;
  saveAndReload({action:'tayangDelete',id:id},'Dihapus');
}

// ═════════════ MANAGER (target creative per bulan) ═════════════
function hasKamp(k){return k!=='Awareness Offline';}   // target kampanye hanya untuk Awareness Online & Iklan Penjualan
function tgtKamp(m,k,d){var r=D.targets.filter(function(x){return x.bulan===m&&x.kategori===k&&x.divisi===d;})[0];return r&&r.kampanye!=null?r.kampanye:null;}
// jumlah kampanye yang sudah ada = nama kampanye berbeda pada creative yang dicatat di bulan itu (per kategori & divisi)
function kampMade(m,k,d){var seen={},n=0;inMonth(m).forEach(function(c){if(c.kategori!==k||c.divisi!==d)return;var key=kampKey(c.kampanye);if(key&&!seen[key]){seen[key]=1;n++;}});return n;}
function mgInit(m){var v={w:(tgtW(m)==null?'':String(tgtW(m)))};KATS.forEach(function(k,i){DIVISI.forEach(function(d,j){var t=tgtOf(m,k,d);v[i+'_'+j]=t==null?'':String(t);if(hasKamp(k)){var kt=tgtKamp(m,k,d);v['k'+i+'_'+j]=kt==null?'':String(kt);}});});S.mt={bulan:m,vals:v};}
function mgSync(){if(!S.mt)return;var wi=$('mg_w');if(wi)S.mt.vals.w=wi.value;KATS.forEach(function(k,i){DIVISI.forEach(function(d,j){var e=$('mg_'+i+'_'+j);if(e)S.mt.vals[i+'_'+j]=e.value;var f=$('mg_k'+i+'_'+j);if(f)S.mt.vals['k'+i+'_'+j]=f.value;});});}
function mgCalc(){mgSync();var g=0,gk=0;KATS.forEach(function(k,i){var s=0,sk=0;DIVISI.forEach(function(d,j){s+=+S.mt.vals[i+'_'+j]||0;if(hasKamp(k))sk+=+S.mt.vals['k'+i+'_'+j]||0;});g+=s;gk+=sk;var e=$('mg_t'+i);if(e)e.textContent=n0(s);var f=$('mg_kt'+i);if(f)f.textContent=n0(sk);});var e=$('mg_g');if(e)e.textContent=n0(g);var f=$('mg_kg');if(f)f.textContent=n0(gk);}
function mgPick(m){mgInit(m);render();}
function mgSave(){
  mgSync();var items=[];
  for(var i=0;i<KATS.length;i++)for(var j=0;j<DIVISI.length;j++){
    var v=String(S.mt.vals[i+'_'+j]).trim();if(v==='')v='0';
    if(!/^\d{1,4}$/.test(v)){toast('Target creative harus bilangan bulat 0 sampai 9999 ('+KATS[i]+' · '+DIVISI[j]+')',true);return;}
    var it={kategori:KATS[i],divisi:DIVISI[j],jumlah:+v};
    if(hasKamp(KATS[i])){
      var kv=String(S.mt.vals['k'+i+'_'+j]).trim();
      if(kv!==''&&!/^\d{1,4}$/.test(kv)){toast('Target kampanye harus bilangan bulat 0 sampai 9999 ('+KATS[i]+' · '+DIVISI[j]+')',true);return;}
      it.kampanye=kv===''?null:+kv;
    }
    items.push(it);
  }
  var wv=String(S.mt.vals.w==null?'':S.mt.vals.w).trim();
  if(wv!==''&&!/^\d{1,4}$/.test(wv)){toast('Target Winner harus bilangan bulat 0 sampai 9999',true);return;}
  $('mg_save').disabled=true;
  saveAndReload({action:'target',bulan:S.mt.bulan,items:items,winner:wv},'Target tersimpan').then(function(ok){if(ok){mgInit(S.mt.bulan);render();}else{var b=$('mg_save');if(b)b.disabled=false;}});
}
function mgSec(label,totId,sum,first){return '<div class="row" style="align-items:flex-end;'+(first?'margin-top:12px':'margin-top:16px;padding-top:14px;border-top:1px solid var(--bdr)')+'"><div class="h" style="margin:0;flex:1">'+label+'</div><div style="text-align:right"><span class="sm mut">Total</span> <b id="'+totId+'" style="font-size:22px;line-height:1;color:var(--m-d)">'+n0(sum)+'</b></div></div>';}
function mgCell(ed,d,id,v,made,madeLbl){
  return '<div style="min-width:0"><label class="lbl" style="margin-top:0">'+esc(d)+'</label>'+
    (ed?'<input class="inp" type="number" inputmode="numeric" min="0" max="9999" step="1" id="'+id+'" value="'+esc(v)+'" placeholder="0" oninput="mgCalc()">':'<div class="bigh'+(v===''?' na':'')+'" style="font-size:34px">'+(v===''?'—':n0(+v))+'</div>')+
    '<div class="sm mut" style="margin-top:6px">'+madeLbl+': <b>'+made+'</b></div></div>';
}
function vMgr(){
  if(!S.mt)mgInit(MON());
  var m=S.mt.bulan,ed=can('mgr'),h='<div class="mid" style="margin-bottom:12px">Manager</div>';
  h+=ed?note('Tentukan target tiap bulan, per kategori dan per divisi: jumlah creative, dan jumlah kampanye (khusus Awareness Online dan Iklan Penjualan). Hanya Manager yang bisa mengubah.'):note('Halaman ini hanya bisa diubah oleh Manager (Lukman). Anda bisa melihat targetnya.','warn');
  h+='<div class="chips">'+[MON(),nextMon(MON())].map(function(x){return '<button class="chip '+(m===x?'on':'')+'" onclick="mgPick(\''+x+'\')">'+esc(monLabel(x))+(x===MON()?' (bulan ini)':'')+'</button>';}).join('')+'</div>';
  var g=0,gk=0,made=inMonth(m);
  h+='<div class="gridc cards">'+KATS.map(function(k,i){
    var sum=0,sumK=0;
    var cells=DIVISI.map(function(d,j){
      var v=S.mt.vals[i+'_'+j];sum+=+v||0;
      return mgCell(ed,d,'mg_'+i+'_'+j,v,made.filter(function(c){return c.kategori===k&&c.divisi===d;}).length,'Sudah dibuat');
    }).join('');
    var kcells='';
    if(hasKamp(k))kcells=DIVISI.map(function(d,j){
      var v=S.mt.vals['k'+i+'_'+j];sumK+=+v||0;
      return mgCell(ed,d,'mg_k'+i+'_'+j,v,kampMade(m,k,d),'Sudah ada');
    }).join('');
    g+=sum;gk+=sumK;
    return '<div class="card" style="margin-bottom:0"><div class="kr-t" style="font-size:15px">'+esc(k)+'</div>'+
      mgSec('Jumlah creative','mg_t'+i,sum,true)+'<div class="grid2" style="margin-top:12px">'+cells+'</div>'+
      (hasKamp(k)?mgSec('Jumlah kampanye','mg_kt'+i,sumK,false)+'<div class="grid2" style="margin-top:12px">'+kcells+'</div>':'')+'</div>';
  }).join('')+'</div>';
  h+='<div class="sm mut" style="margin:10px 2px 0">“Sudah ada” untuk kampanye = jumlah nama kampanye berbeda pada creative yang dicatat bulan ini, per kategori dan divisi. Kolom target kampanye yang dikosongkan berarti belum ditetapkan.</div>';
  var ws=bcStats(m),wv=S.mt.vals.w;
  h+='<div class="card fw" style="margin-top:14px"><div class="kr-t" style="font-size:15px">Target Winner '+esc(monLabel(m))+'</div><div class="sm mut" style="margin:4px 0 10px">Jumlah creative yang diharapkan ditetapkan Winner oleh Advertiser bulan ini. Dipakai untuk status performa Brand Creator di Dashboard. Kosong = belum ditetapkan.</div>'+
    (ed?'<input class="inp" type="number" inputmode="numeric" min="0" max="9999" step="1" id="mg_w" value="'+esc(wv)+'" placeholder="mis. 6" style="max-width:160px">':'<div class="bigh'+(wv===''?' na':'')+'" style="font-size:34px">'+(wv===''?'—':n0(+wv))+'</div>')+
    '<div class="sm mut" style="margin-top:6px">Winner bulan ini: <b>'+ws.win.length+'</b> dari '+ws.tested.length+' creative yang diuji</div></div>';
  h+='<div class="card fw" style="margin-top:14px"><div class="row"><div class="kr-t" style="font-size:15px">Total target creative '+esc(monLabel(m))+'</div><b class="sp" id="mg_g" style="font-size:30px;line-height:1;color:var(--m-d)">'+n0(g)+'</b></div>'+
    '<div class="row" style="margin-top:8px"><div class="kr-t" style="font-size:15px">Total target kampanye '+esc(monLabel(m))+'</div><b class="sp" id="mg_kg" style="font-size:30px;line-height:1;color:var(--m-d)">'+n0(gk)+'</b></div>'+
    (ed?'<button class="btn" id="mg_save" onclick="mgSave()">Simpan target</button>':'')+'</div>';
  return h;
}

(function(){
  S.ok=true;S.who=ls('bc_who')||'';
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
  start();
})();
</script>
