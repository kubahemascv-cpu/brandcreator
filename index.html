<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brand Creator · Kubah Emas</title>
<meta name="theme-color" content="#0F2A2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brand Creator">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --m:#2CC5B8;--m-d:#0B6B68;--m-l:#E3F6F4;--m-b:#A6E1DB;
  --ch:#0F2A2E;--ch2:#17383D;--bg:#F1F6F6;--bg2:#E2EBEB;--card:#fff;--card2:#F8FBFB;
  --txt:#12262A;--txt2:#3B4F53;--mut:#6B8084;--bdr:#DCE7E7;
  --ok:#16A34A;--ok-l:#E8F7EE;--warn:#D97706;--warn-l:#FEF3E2;--bad:#DC2626;--bad-l:#FEF3F2;
  --shd:0 1px 2px rgba(15,42,46,.04),0 6px 20px rgba(15,42,46,.06);
  --font:'Plus Jakarta Sans',-apple-system,sans-serif;--r:18px;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding-bottom:96px}
button,input,select,textarea{font-family:var(--font)}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bdr);padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top))}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ch);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.04em;color:var(--m);flex-shrink:0}
.bn{font-size:15px;font-weight:800;letter-spacing:-.01em}.bs{font-size:11px;color:var(--mut)}
.who{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--ch);color:var(--m);padding:8px 13px;border-radius:999px;border:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--shd);padding:18px;margin-bottom:14px}
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(44,197,184,.34),transparent 55%),var(--ch);color:#fff;border:none}
.hero .mut{color:rgba(255,255,255,.62)}
.mut{color:var(--mut)}
.h{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.hero .h{color:rgba(255,255,255,.55)}
.mid{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.sm{font-size:12px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}

.stat .sub{display:block;font-size:10px;line-height:1.45;color:rgba(255,255,255,.55);font-weight:600;margin-top:4px}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--m);line-height:1.05}.stat span{font-size:10.5px;color:rgba(255,255,255,.65);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-left:auto}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok-l);color:var(--ok)}.tag.warn{background:var(--warn-l);color:var(--warn)}.tag.bad{background:var(--bad-l);color:var(--bad)}.tag.na{background:var(--bg2);color:var(--mut)}.tag.brand{background:var(--m-l);color:var(--m-d)}.tag.dv{background:var(--ch);color:var(--m)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.note{display:flex;gap:10px;font-size:12px;line-height:1.55;padding:11px 13px;border-radius:13px;background:var(--card2);border:1px solid var(--bdr);margin-bottom:14px;color:var(--txt2)}
.note.warn{background:var(--warn-l);border-color:#F6D8A8;color:#7C4A03}
.note.bad{background:var(--bad-l);border-color:#FBC9C4;color:#8F1D14}
.note.ok{background:var(--ok-l);border-color:#BDE5CC;color:#14532D}
.kr-t{font-size:13.5px;font-weight:800;line-height:1.35;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:8px 6px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);border-bottom:2px solid var(--bdr)}
td{padding:10px 6px;border-bottom:1px solid var(--bdr);vertical-align:top}
th.r,td.r{text-align:right}
tr:last-child td{border-bottom:none}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.inp,.sel,.ta{width:100%;border:1.5px solid var(--bdr);border-radius:13px;background:var(--card2);padding:0 14px;font-size:14px;font-weight:600;color:var(--txt);outline:none}
.inp,.sel{height:46px}
.ta{padding:12px 14px;min-height:78px;resize:vertical;font-weight:500;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--m-d);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;height:50px;border:none;border-radius:14px;background:var(--m);color:var(--ch);font-size:14.5px;font-weight:800;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--bg2);color:var(--txt)}
.btn.dark{background:var(--ch);color:var(--m)}
.btn.s{height:36px;font-size:12px;margin-top:0;width:auto;padding:0 14px;border-radius:11px}
.btn.danger{background:var(--bad-l);color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--bdr);background:var(--card);border-radius:99px;padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--txt2);cursor:pointer}
.chip.on{background:var(--ch);color:var(--m);border-color:var(--ch)}
.chip.xs{padding:6px 12px;font-size:11.5px}
.dvh{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--m-d);margin:18px 0 8px}
.killbox{background:var(--bad-l);border:1px solid #FBC9C4;color:#8F1D14;border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.5;margin-top:8px}
.btn.kill{background:var(--bad);color:#fff}
.ctrl{font-size:12px;font-weight:700;color:var(--txt2);margin-top:4px}
.ctrl b{font-size:15px;color:var(--m-d)}
.tgt .bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:8px}
.tgt .bar>i{display:block;height:100%;border-radius:99px;background:var(--m)}
.tgt .fr{font-size:22px;font-weight:800;line-height:1}.tgt .fr small{font-size:13px;color:var(--mut);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bdr);padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.nav-in{max-width:760px;margin:0 auto;display:flex;gap:2px}
.nav button{flex:1;border:none;background:none;padding:7px 2px;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{background:var(--ch);color:var(--m)}
.gate{max-width:380px;margin:12vh auto 0;padding:0 18px;text-align:center}
.gate .logo{width:64px;height:64px;font-size:18px;border-radius:19px;margin:0 auto 18px}
.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:800}
.pick{display:flex;flex-direction:column;gap:10px;text-align:left}
.pick button{border:1.5px solid var(--bdr);background:var(--card);border-radius:15px;padding:14px 16px;cursor:pointer;text-align:left}
.pick b{display:block;font-size:15px}.pick span{font-size:11.5px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ch);color:#fff;padding:11px 18px;border-radius:99px;font-size:12.5px;font-weight:700;z-index:99;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);border-radius:16px}
.spin{text-align:center;padding:60px 0;color:var(--mut);font-size:13px;font-weight:600}
.item{border-top:1px solid var(--bdr);padding:12px 0}.item:first-child{border-top:none;padding-top:0}
.cr{display:flex;gap:12px;align-items:flex-start}
.thw{position:relative;width:64px;height:64px;border-radius:12px;background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.thw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cr .bd{flex:1;min-width:0}
.tr{background:var(--card2);border:1px solid var(--bdr);border-radius:13px;padding:11px 12px;margin-top:10px}
.tr .k{font-size:11px;color:var(--mut);font-weight:700}
.linkb{display:inline-block;font-size:12px;font-weight:800;color:var(--m-d);text-decoration:none;margin-right:12px}
.pv{background:var(--m-l);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;margin-top:10px}
.fbox{border:1.5px solid var(--m-b);background:#F4FBFA;border-radius:14px;padding:14px;margin-top:10px}
.rk{font-weight:800;color:var(--m-d)}
.empty{text-align:center;color:var(--mut);font-size:12.5px;padding:18px 6px}
/* input tanggal: jangan pernah melewati kotaknya (Safari/Chrome HP memberi lebar bawaan yang besar) */
input[type=date]{display:block;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left;padding-right:10px}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
.fbox,.fbox *{min-width:0}
.fbox{overflow:hidden}
.dates{display:flex;flex-direction:column;gap:2px}
/* angka Hasil besar */
.bigh{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--m-d)}
.bigh.na{color:var(--mut);font-size:30px}
.hj{font-size:12px;font-weight:700;color:var(--txt2);margin-top:4px}
.inp.huge{height:68px;font-size:30px;font-weight:800;text-align:center}
.rbar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:8px}
.rbar>i{display:block;height:100%;border-radius:99px;background:var(--m)}
.rrow .num{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em;text-align:right}
.rrow.best .num{color:var(--m-d)}
.crl{font-size:12px;color:var(--txt2);margin-top:6px;line-height:1.7}
.crl b{font-weight:800}
.heroTop{font-size:12px;color:rgba(255,255,255,.7);font-weight:600}
.heroName{font-size:26px;font-weight:800;line-height:1.15;margin:4px 0 2px;word-break:break-word}
.heroNum{font-size:56px;font-weight:800;line-height:1;color:var(--m);letter-spacing:-.02em}
/* susunan kartu: 1 kolom di HP, menyesuaikan lebar layar di desktop */
.gridc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px;align-items:start}
.gridc.cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.gridc>.card,.advgrid>.card{margin-bottom:0}
.gridc .span{grid-column:1/-1}
.gridc .chips{margin-bottom:0}
.advgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.fw{max-width:720px}
@media(min-width:860px){
  body{padding-bottom:0}
  body.shell{padding-left:240px}
  body.shell::before{content:'';position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--ch);z-index:40}
  body.shell .top{position:fixed;left:0;top:0;width:240px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;padding:24px 20px 8px}
  body.shell .top-in{max-width:none}
  body.shell .logo{background:var(--m);color:var(--ch)}
  body.shell .bn{color:#fff}body.shell .bs{color:rgba(255,255,255,.55)}
  body.shell .who{position:fixed;left:20px;bottom:22px;width:200px;margin:0;background:var(--ch2);color:var(--m);padding:12px 14px;text-align:left}
  body.shell .nav{position:fixed;left:0;top:96px;bottom:76px;width:240px;background:transparent;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:10px 14px;z-index:60}
  body.shell .nav-in{max-width:none;flex-direction:column;gap:4px}
  body.shell .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:12px 14px;border-radius:12px;color:rgba(255,255,255,.72)}
  body.shell .nav button:hover{background:var(--ch2)}
  body.shell .nav button.on{background:var(--m);color:var(--ch)}
  body.shell .nav button .ic{font-size:18px}
  body.shell .wrap{max-width:none;margin:0;padding:30px 36px 48px}
  .stat b{font-size:34px}.stat span{font-size:12px}
  .toast{bottom:28px}
  .advgrid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-areas:"tay que"}
  .a-que{grid-area:que}.a-tay{grid-area:tay}
}
</style>
</head>
<body>
<div class="top" id="top" style="display:none"><div class="top-in"><div class="logo">BC</div><div><div class="bn">Brand Creator</div><div class="bs">Kubah Emas · Creative ↔ Advertiser</div></div><button class="who" id="whobtn" onclick="switchWho()">—</button></div></div>
<div class="nav" id="nav" style="display:none"><div class="nav-in" id="navin"></div></div>
<div class="wrap" id="view"></div>
<div id="toastbox"></div>
<script>
// ═════════════ KONFIGURASI ═════════════
var APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbx7fvep5uCT_s_RUYbbcv4liCG0jRq5z53kzmz9BaL3QDTw2dI2PfZGo00UHhHnIPu0/exec';
var PEOPLE={
  Lukman:{role:'Manager · Advertiser',creator:true,adv:true,mgr:true},
  Dicky:{role:'Brand Creator',creator:true}
};
// "Hasil" mengikuti kolom Hasil di Meta Ads Manager (jenisnya tergantung objektif kampanye)
var JENIS=['Percakapan WA','ThruPlay','Klik tautan','Jangkauan'];
var KATS=['Awareness Online','Awareness Offline','Iklan Penjualan'];
var DIVISI=['Kubah Emas','Kumasindo'];
var ALASAN=['CTR rendah','Hasil rendah / CPL mahal','Creative jenuh','Budget dialihkan','Kampanye selesai / musiman','Lainnya'];
function isOff(c){return c.kategori==='Awareness Offline';}   // creative offline tidak diiklankan: tidak punya tayang/Hasil
var MONTH_ID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

// ═════════════ UTIL ═════════════
var S={ok:true,who:'',tab:'dash',loaded:false,err:'',kf:'',cdv:'',af:'',sort:{},mt:null,cf:null,ed:null};
var D={creatives:[],tayang:[],targets:[],kills:[],today:'',month:''};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function TD(){return D.today||dstr(new Date());}
function dDiff(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function dLabel(s){if(!s)return '—';var d=pd(s);return d.getDate()+' '+MONTH_ID[d.getMonth()].slice(0,3)+' '+d.getFullYear();}
function n0(n){return Math.round(n).toLocaleString('id-ID');}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(msg,bad){var t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=msg;$('toastbox').appendChild(t);setTimeout(function(){t.remove();},bad?5500:2200);}
function can(k){return !!(PEOPLE[S.who]&&PEOPLE[S.who][k]);}
function note(t,type){return '<div class="note '+(type||'')+'"><span>'+(type==='warn'?'⚠️':type==='bad'?'❌':type==='ok'?'✅':'ℹ️')+'</span><span>'+t+'</span></div>';}

// ═════════════ API ═════════════
function apiReady(){return APPS_SCRIPT_URL&&APPS_SCRIPT_URL.indexOf('PASTE_')!==0;}
function apiLoad(){
  return fetch(APPS_SCRIPT_URL+'?action=load&cb='+Date.now()).then(function(r){return r.json();}).then(function(j){
    if(!j.ok)throw new Error(j.error||'Server menolak permintaan');
    D={creatives:j.creatives||[],tayang:j.tayang||[],targets:j.targets||[],kills:j.kills||[],today:j.today||'',month:j.month||''};
  });
}
function apiPost(p){
  return fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({by:S.who},p))})
    .then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Gagal menyimpan');return j;});
}
function saveAndReload(p,okMsg){
  return apiPost(p).then(function(){return apiLoad();}).then(function(){toast(okMsg||'Tersimpan');render();return true;})
    .catch(function(e){var m=String(e.message||e);if(/tidak dikenal|PIN salah/.test(m))m='Server belum diperbarui: deploy ulang Apps Script terbaru.';toast(m,true);return false;});
}

// ═════════════ DATA TURUNAN ═════════════
function creativeOf(id){return D.creatives.filter(function(c){return c.id===id;})[0]||null;}
function tayOf(cid){return D.tayang.filter(function(t){return t.cid===cid;}).sort(function(a,b){return a.mulai<b.mulai?1:a.mulai>b.mulai?-1:0;});}
function tStatus(t){var td=TD();if(td<t.mulai)return 'Terjadwal';if(t.selesai&&td>t.selesai)return 'Selesai';return 'Berjalan';}
function tDays(t){var td=TD();if(td<t.mulai)return 0;var end=t.selesai&&t.selesai<td?t.selesai:td;return dDiff(t.mulai,end)+1;}
function jenisLabel(name){var n=String(name||'').trim().toLowerCase();for(var i=0;i<JENIS.length;i++)if(JENIS[i].toLowerCase()===n)return JENIS[i];return String(name||'').trim();}
function crStatus(c){
  var ts=tayOf(c.id);if(!ts.length)return {t:'na',x:'Belum tayang'};
  if(ts.some(function(t){return tStatus(t)==='Berjalan';}))return {t:'ok',x:'Berjalan'+(ts.length>1?' · '+ts.length+' tayang':'')};
  if(ts.every(function(t){return tStatus(t)==='Terjadwal';}))return {t:'warn',x:'Terjadwal'};
  return {t:'brand',x:'Selesai'+(ts.length>1?' · '+ts.length+' tayang':'')};
}
function kampanyeList(){   // kampanye unik, yang terbaru di depan
  var seen={},out=[];
  D.creatives.slice().sort(function(a,b){return a.created<b.created?1:-1;}).forEach(function(c){var k=c.kampanye.toLowerCase();if(!seen[k]){seen[k]=1;out.push(c.kampanye);}});
  return out;
}
// Data per kampanye: creative terurut skor (Hasil) dari terbesar. Jenis hasil berbeda tidak dijumlahkan (ThruPlay ribuan akan menenggelamkan Percakapan WA).
function campData(){
  var camps={},jcount={};
  D.creatives.forEach(function(c){var k=c.kampanye.toLowerCase(),g=camps[k]||(camps[k]={name:c.kampanye,all:[],groups:{}});g.all.push(c);});
  D.tayang.forEach(function(t){
    if(!t.jenis||t.hasil==null)return;
    var c=creativeOf(t.cid);if(!c)return;
    var camp=camps[c.kampanye.toLowerCase()],jl=jenisLabel(t.jenis),jk=jl.toLowerCase();
    var g=camp.groups[jk]||(camp.groups[jk]={label:jl,total:0,rows:{}});
    g.total+=t.hasil;
    var r=g.rows[c.id]||(g.rows[c.id]={c:c,hasil:0});r.hasil+=t.hasil;
  });
  Object.keys(camps).forEach(function(k){Object.keys(camps[k].groups).forEach(function(jk){jcount[jk]=(jcount[jk]||0)+Object.keys(camps[k].groups[jk].rows).length;});});
  var jorder=Object.keys(jcount).sort(function(a,b){return jcount[b]-jcount[a]||(a<b?-1:1);});
  var list=Object.keys(camps).map(function(k){
    var c=camps[k],scored={};
    c.garr=jorder.filter(function(jk){return c.groups[jk];}).map(function(jk){
      var g=c.groups[jk];g.list=Object.keys(g.rows).map(function(i){scored[i]=1;return g.rows[i];}).sort(function(a,b){return b.hasil-a.hasil||(a.c.nama<b.c.nama?-1:1);});return g;});
    c.unscored=c.all.filter(function(x){return !scored[x.id];}).sort(function(a,b){return a.nama<b.nama?-1:1;});
    return c;
  });
  addCtrLists(list);
  list.sort(function(a,b){
    if(!!a.garr.length!==!!b.garr.length)return a.garr.length?-1:1;
    for(var i=0;i<jorder.length;i++){var x=(a.groups[jorder[i]]||{total:0}).total,y=(b.groups[jorder[i]]||{total:0}).total;if(x!==y)return y-x;}
    return b.all.length-a.all.length||(a.name<b.name?-1:1);
  });
  return list;
}
function ctrFmt(x){return x.toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:2})+'%';}
// CTR tidak bisa dijumlahkan antar tayang: yang dipakai = CTR dari tayang TERBARU yang CTR-nya sudah diisi
function ctrOf(cid){var ts=tayOf(cid);for(var i=0;i<ts.length;i++)if(ts[i].ctr!=null)return ts[i].ctr;return null;}
function hasilStr(cid){var sum={};tayOf(cid).forEach(function(t){if(t.jenis&&t.hasil!=null){var j=jenisLabel(t.jenis);sum[j]=(sum[j]||0)+t.hasil;}});return Object.keys(sum).map(function(j){return '<b>'+n0(sum[j])+'</b> '+esc(j);}).join(' · ');}
function hasilTot(cid){var n=0;tayOf(cid).forEach(function(t){if(t.hasil!=null)n+=t.hasil;});return n;}
function addCtrLists(list){
  list.forEach(function(c){
    var a=c.all.map(function(x){return {c:x,ctr:ctrOf(x.id)};});
    c.ctrList=a.filter(function(r){return r.ctr!=null;}).sort(function(p,q){return q.ctr-p.ctr||hasilTot(q.c.id)-hasilTot(p.c.id)||(p.c.nama<q.c.nama?-1:1);});
    c.noCtr=a.filter(function(r){return r.ctr==null;}).map(function(r){return r.c;}).sort(function(p,q){return p.nama<q.nama?-1:1;});
  });
  return list;
}
// hitung jumlah creative: total, per kategori, per divisi, dan kategori x divisi
function tally(list){
  var t={total:list.length,div:{},kat:{},nodiv:0,nokat:0};
  DIVISI.forEach(function(d){t.div[d]=0;});
  KATS.forEach(function(k){t.kat[k]={n:0,d:{}};DIVISI.forEach(function(d){t.kat[k].d[d]=0;});});
  list.forEach(function(c){
    var hd=t.div[c.divisi]!==undefined;if(hd)t.div[c.divisi]++;else t.nodiv++;
    var kk=t.kat[c.kategori];if(kk){kk.n++;if(hd)kk.d[c.divisi]++;}else t.nokat++;
  });
  return t;
}
function MON(){return D.month||TD().slice(0,7);}
function nextMon(m){var a=m.split('-'),y=+a[0],mo=+a[1]+1;if(mo>12){mo=1;y++;}return y+'-'+String(mo).padStart(2,'0');}
function monLabel(m){var a=m.split('-');return MONTH_ID[+a[1]-1]+' '+a[0];}
function tgtOf(m,k,d){var r=D.targets.filter(function(x){return x.bulan===m&&x.kategori===k&&x.divisi===d;})[0];return r?r.jumlah:null;}
function hasTgt(m){return D.targets.some(function(x){return x.bulan===m;});}
function kampKey(n){return String(n||'').toLowerCase();}
function killRec(tipe,target){return D.kills.filter(function(k){return k.tipe===tipe&&k.target===target;})[0]||null;}
// KILL efektif sebuah creative: KILL sendiri, atau ikut kampanyenya
function killOf(c){var k=killRec('creative',c.id),own=true;if(!k){k=killRec('kampanye',kampKey(c.kampanye));own=false;}return k?{own:own,src:own?'creative':'kampanye',alasan:k.alasan,catatan:k.catatan,by:k.by,ts:k.ts}:null;}
function killTxt(k){return k.alasan+(k.catatan?' — '+k.catatan:'');}
function killBox(k,pre){return '<div class="killbox"><b>KILL</b>'+(pre||'')+' · '+esc(killTxt(k))+'<div class="sm" style="opacity:.8">Oleh '+esc(k.by)+' · '+dLabel((k.ts||'').slice(0,10))+'</div></div>';}
function dKill(c){var k=killRec('creative',c.id);return k?' · <b style="color:var(--bad)">KILL: '+esc(k.alasan)+'</b>':'';}
function inMonth(m){return D.creatives.filter(function(c){return (c.created||'').slice(0,7)===m;});}

function errHint(m){
  if(/PIN salah/.test(m))return 'Apps Script yang ter-deploy masih versi lama (masih meminta PIN). Tempel kode Apps Script terbaru, lalu Deploy → Manage deployments → Edit → Version: <b>New</b> → Deploy.';
  if(/Masih versi lama|masih versi lama/.test(m))return 'Tab di Spreadsheet masih dari versi lama. <b>Hapus tab Creative, Tayang, dan Config</b> di Spreadsheet, lalu tekan Coba lagi (tab baru dibuat otomatis).';
  if(/Unexpected token|JSON|DOCTYPE|<html/i.test(m))return 'Server membalas halaman web, bukan data. Biasanya akses deploy belum <b>Anyone</b>, atau URL belum menunjuk ke versi terbaru. Di Apps Script: Deploy → Manage deployments → Edit → Version: <b>New</b> → Deploy, pastikan "Who has access" = Anyone, lalu pastikan URL yang dipakai berakhiran <b>/exec</b>.';
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return 'App tidak bisa menghubungi Apps Script. Cek koneksi internet. Kalau koneksi normal, biasanya akses deploy belum <b>Anyone</b> atau URL salah (harus berakhiran /exec).';

  if(/izin|permission|authoriz|Exception/i.test(m))return 'Script belum diberi izin. Di editor Apps Script, pilih fungsi <b>authorize_</b>, klik Run, setujui izin, lalu Deploy → Version: New.';

    }).join('');
    g+=sum;
    return '<div class="card" style="margin-bottom:0"><div class="row" style="align-items:flex-start"><div class="kr-t" style="font-size:15px;flex:1">'+esc(k)+'</div><div style="text-align:right"><div class="sm mut">Total</div><b id="mg_t'+i+'" style="font-size:26px;line-height:1;color:var(--m-d)">'+n0(sum)+'</b></div></div><div class="grid2" style="margin-top:14px">'+cells+'</div></div>';
  }).join('')+'</div>';
  h+='<div class="card fw" style="margin-top:14px"><div class="row"><div class="kr-t" style="font-size:15px">Total target '+esc(monLabel(m))+'</div><b class="sp" id="mg_g" style="font-size:30px;line-height:1;color:var(--m-d)">'+n0(g)+'</b></div>'+
    (ed?'<button class="btn" id="mg_save" onclick="mgSave()">Simpan target</button>':'')+'</div>';
  return h;
}
